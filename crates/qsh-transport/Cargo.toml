[package]
name = "qsh-transport"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "QUIC transport layer (quinn + rustls) for qsh, a QUIC-based direct-connect remote shell."
keywords = ["quic", "remote-shell", "quinn", "rustls", "transport"]
categories = ["network-programming", "asynchronous"]
# Integration tests stay out of the tarball (see the publishing note in the
# workspace root Cargo.toml). Anchored so `src/**/tests/` module dirs ship.
exclude = ["/tests/"]

[features]
# Test seams for sibling crates' tests (`Connection::with_peer_chain_dropped`).
# Never enabled by a normal build; `qsh-core` turns it on in dev-dependencies.
# Also builds `test_relay` (an in-process iroh relay server) for the serve
# tests in sibling crates; never enabled by a normal build.
test-support = ["dep:iroh-relay"]

[dependencies]
qsh-proto.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
x509-parser.workspace = true
aws-lc-rs.workspace = true
quinn-proto.workspace = true
bytes.workspace = true
tokio.workspace = true
prost.workspace = true
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
socket2.workspace = true
zeroize.workspace = true
iroh.workspace = true
rustls-native-certs.workspace = true
# The relay server behind `test_relay`, `test-support` only.
iroh-relay = { version = "1.4.1", optional = true, default-features = false, features = ["server", "test-utils"] }

[dev-dependencies]
rcgen.workspace = true
# In-process relay server for the iroh tests (`iroh_relay::server::testing`
# mints the self-signed certificate the tests then trust explicitly).
iroh = { workspace = true, features = ["test-utils"] }
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "test-utils"] }
time.workspace = true
tokio = { workspace = true, features = ["test-util"] }
