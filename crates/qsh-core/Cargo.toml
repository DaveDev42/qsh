[package]
name = "qsh-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qsh-proto.workspace = true
qsh-transport.workspace = true
# `quinn::SendStream`/`RecvStream` are named directly by `localctl/daemon.rs`
# (`cfg(unix)`-only, `crate::localctl` mod declaration): the `LOCAL_STREAM`
# splice (`PLAN.md` M3 Step 7) opens a raw QUIC bidi stream on a live
# `qsh-transport::Connection` and pumps bytes on it without going through
# `qsh-transport::FramedSend`/`FramedRecv` (those only speak framed
# messages, not arbitrary raw bytes) — `daemon.rs` is arch-lint's
# documented transport-bridge exemption (`xtask arch`'s `LOCALCTL_*`
# constants), so naming `quinn` here does not cross the workspace-crate
# dependency matrix (that matrix only tracks `qsh-*` crates). Already a
# transitive dependency via `qsh-transport`, same lockfile entry.
quinn.workspace = true
# `prost::Message` is named directly by `localctl/frame.rs`'s generic
# conduit send/recv (`docs/design/protocol.md` §5, §11-3) — a lightweight,
# sans-IO leaf dependency `qsh-proto` already carries; naming it here does
# not cross the workspace-crate dependency matrix `xtask arch` enforces.
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
rcgen.workspace = true
zeroize.workspace = true
base64.workspace = true
bytes.workspace = true
time.workspace = true
ulid.workspace = true
rand.workspace = true
blake3.workspace = true
subtle.workspace = true
libc.workspace = true
# `doctor.run`'s `bindv6only_blocks_ipv4` probe (`crate::doctor::probe`)
# binds a throwaway socket at the same wildcard IP `Listener::bind` would,
# but on an ephemeral port so it never collides with a real listener
# (`qsh_transport::bind_tuned_udp_socket`) and reads `only_v6()` off it —
# already the pinned version `qsh-transport` resolves to (workspace-
# resolved via `quinn`/`quinn-udp`, no second copy in the dependency tree,
# same note the workspace `Cargo.toml` entry makes).
socket2.workspace = true

# The OS credential store is only wired up on the platforms QSH supports as
# hosts today (`docs/design/architecture.md` §5, §8: keyring 3.x pinned).
# Linux uses the pure-Rust async Secret Service backend so no libdbus /
# system C dependency is needed; where neither table applies
# (`PlatformKeyStore`) reports `Unavailable` and `auto` falls back to file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

# POSIX PTY backend (`docs/design/architecture.md` §4): openpty + spawn with
# setsid/controlling tty. The whole `pty` module is unix-only (`docs/ROADMAP.md`
# §3: no Windows host in P0), so the crate builds on Windows without it.
[target.'cfg(unix)'.dependencies]
portable-pty.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# `serve::bind_setup_error`'s unit tests construct a real
# `qsh_transport::SetupError::Tls(rustls::Error)` to prove the bind-conflict
# remedy is not attached to a TLS config failure — test-only, already the
# same pinned version `qsh-transport` uses (workspace-resolved, no second
# copy).
rustls.workspace = true
# `tokio::time::pause()`/`advance()` and `#[tokio::test(start_paused)]` need
# the test-util feature; only pulled in for tests (`docs/design/testing.md`
# L2: no `sleep()`, deterministic time).
tokio = { workspace = true, features = ["test-util"] }
