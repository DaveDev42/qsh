[package]
name = "qsh-core"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Session broker, ACL enforcement, identity and trust for qsh, a QUIC-based direct-connect remote shell."
keywords = ["quic", "remote-shell", "pty", "session", "ssh"]
categories = ["network-programming", "authentication"]
# Integration tests stay out of the tarball (see the publishing note in the
# workspace root Cargo.toml). Anchored so `src/**/tests/` module dirs ship.
exclude = ["/tests/"]

[dependencies]
qsh-proto.workspace = true
qsh-transport.workspace = true
# `prost::Message` is named directly by `localctl/frame.rs`'s generic
# conduit send/recv (`docs/design/protocol.md` §5, §11-3) — a lightweight,
# sans-IO leaf dependency `qsh-proto` already carries; naming it here does
# not cross the workspace-crate dependency matrix `xtask arch` enforces.
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
rcgen.workspace = true
zeroize.workspace = true
# SHA-256 of the OpenSSH wire public key blob for the SSH fingerprint
# `qsh init --import-ssh-key` prints (ADR-0026); already resolved via
# `qsh-transport`.
sha2.workspace = true
base64.workspace = true
bytes.workspace = true
time.workspace = true
ulid.workspace = true
rand.workspace = true
blake3.workspace = true
subtle.workspace = true
libc.workspace = true
# `doctor.run`'s `bindv6only_blocks_ipv4` probe (`crate::doctor::probe`)
# binds a throwaway socket at the same wildcard IP `Listener::bind` would,
# but on an ephemeral port so it never collides with a real listener
# (`qsh_transport::bind_tuned_udp_socket`) and reads `only_v6()` off it —
# already the pinned version `qsh-transport` resolves to (workspace-
# resolved via `quinn`/`quinn-udp`, no second copy in the dependency tree,
# same note the workspace `Cargo.toml` entry makes).
socket2.workspace = true

# The OS credential store is only wired up on the platforms QSH supports as
# hosts today (`docs/design/architecture.md` §5, §8: keyring-core 1 plus one
# store crate per platform). `keyring-core` is the trait layer only; the
# store is picked per target and opened per operation in
# `identity/keystore.rs`, never registered as keyring's global default store.
# Linux uses the pure-Rust zbus Secret Service store with the `crypto-rust`
# feature (the `openssl` feature is banned by `deny.toml`), so no libdbus /
# system C dependency is needed. Windows uses `windows-native-keyring-store`
# (Credential Manager, ADR-0035 decision 12) with `default-features = false`,
# which drops its `search` feature and the `regex` dependency; the store only
# ever builds, reads, writes and deletes one entry per operation. Where no
# table applies (`PlatformKeyStore`) reports `Unavailable` and `auto` falls
# back to file.
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# The owner-only DACL module (`src/fsutil/dacl.rs`, ADR-0035 decisions 9 and
# 10) builds a security descriptor from the process token's user SID and hands
# it to `CreateFileW` / `CreateDirectoryW`, so a private file or directory
# never exists with an inherited ACL. Only the features those calls need;
# `Win32_Security_Authorization` is the reader (`GetNamedSecurityInfoW`) the
# tests use to pin the result and the setter the unreadable-log test uses.
# `Win32_System_WindowsProgramming` is `QueryUnbiasedInterruptTime`, the
# suspend-excluding clock the wake detector samples (`client/wake.rs`).
# `Win32_System_JobObjects` and the process/console features are the ConPTY
# backend (`src/pty/conpty.rs`, ADR-0035 decision 20): a pseudo-console, a
# Job Object the child is created inside, and `CreateProcessW` with a
# process attribute list (`src/winproc.rs`). `Win32_System_Environment` is
# the user's environment block a session child starts from (decision 21),
# `Win32_Security_Authentication_Identity` the `DOMAIN\user` account name the
# `user@` hint is compared with, and `Win32_System_SystemInformation` the
# Windows directory the default shell falls back to. `Win32_UI_Shell` is
# `GetUserProfileDirectoryW`, the profile directory of the serve account's
# token that a remote file path's `~` and relative forms start from
# (`src/file/guard/windows.rs`, ADR-0035 decision 26); the file host's
# other calls (final path, file identity, reparse points, free space,
# hard links in tests) are in features already listed.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-native-keyring-store = { version = "1.1", default-features = false }
# The Task Scheduler COM reader (`ops/service/task_com.rs`, ADR-0035
# decision 27): `ITaskService` -> `IRegisteredTask` -> the definition's
# principal. Only the interfaces that call chain needs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

# POSIX PTY backend (`docs/design/architecture.md` §4): openpty + spawn with
# setsid/controlling tty. The whole `pty` module is unix-only (`docs/ROADMAP.md`
# §3: no Windows host in P0), so the crate builds on Windows without it.
[target.'cfg(unix)'.dependencies]
portable-pty.workspace = true

# The Credential Manager tests (`identity/keystore.rs`) read the entry back
# with `CredReadW` to pin its type, persistence and target; the store crate
# already links this feature, so it adds nothing to the build. The ConPTY tests
# (`src/pty/conpty/tests.rs`) list a session's processes with a Toolhelp
# snapshot.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# `Connection::with_peer_chain_dropped` stands in for a connection the trust
# watch cannot judge (`trust::connection_watch` tests); not in a normal build.
qsh-transport = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
proptest.workspace = true
# `serve::bind_setup_error`'s unit tests construct a real
# `qsh_transport::SetupError::Tls(rustls::Error)` to prove the bind-conflict
# remedy is not attached to a TLS config failure — test-only, already the
# same pinned version `qsh-transport` uses (workspace-resolved, no second
# copy).
rustls.workspace = true
# `tokio::time::pause()`/`advance()` and `#[tokio::test(start_paused)]` need
# the test-util feature; only pulled in for tests (`docs/design/testing.md`
# L2: no `sleep()`, deterministic time).
tokio = { workspace = true, features = ["test-util"] }
# The in-crate reverse-mode harness (`reverse/test_harness.rs`) captures the
# `qsh::reverse` diagnostic lines through a tracing layer. Test-only, already
# the workspace-pinned version `qsh-cli` and `qsh-testkit` use.
tracing-subscriber.workspace = true
