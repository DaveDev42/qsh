// QSH wire protocol, major version 1 (ALPN "qsh/1").
//
// This file is the reviewable, fuzzable grammar of every control/data
// message QSH puts on a QUIC stream (docs/design/protocol.md §6, §9).
// Rules:
//   * additive only within v1 — never renumber or reuse a field/tag;
//   * every message on the wire is wrapped by the u32-BE length-prefixed
//     frame layer in `qsh-proto/src/frame.rs` (§5);
//   * `Response.Error.code` uses the CLI.md §3.3 error-code strings verbatim.
//
// Scope so far: the M1 walking skeleton (Hello, Response/Error,
// ExecStart/ExecStarted, StreamHeader, ExecFrame, Ping/Pong), the M2
// session surface (session_* control messages, SessionEvent, SessionFrame),
// the M3 reverse-registration field (Hello.reverse), and the M4 tunnel
// control surface (RemoteForwardOpen/Close/Opened, ConnectResult).
// A still-`reserved` tag is left that way so a later milestone cannot
// accidentally take it for something else — protoc / protox reject a field
// that reuses a reserved number. Filling a `reserved` tag with the exact
// message it was reserved for (as M3 did for `Hello.reverse`, and M4 Step 1
// does below for `ControlMessage` 40/41 and `Response` 4) is not a
// violation of the additive-only rule above — the reservation named its
// eventual occupant, so this is that reservation being realized, not a tag
// being reused for a different meaning.

syntax = "proto3";

package qsh.wire.v1;

// ---------------------------------------------------------------------------
// Control stream (one per connection, bidirectional RPC, role-symmetric).
// ---------------------------------------------------------------------------

// Every control-stream frame decodes to exactly one ControlMessage.
// Requests carry a non-zero request_id; the matching Response echoes it.
// Asynchronous events use request_id = 0.
message ControlMessage {
  uint64 request_id = 1;
  // 25 was SessionSignal in early sketches; it is P1 and deliberately left
  //    undefined in v1 (a host answers UNSUPPORTED to it, CLI.md §2.4).
  reserved 25;
  oneof body {
    Hello         hello          = 10;
    Response      response       = 11;

    // Session control (M2). Every session_* request is authorized against
    // the ACL action in CLI.md §2.5 before any resource exists.
    SessionOpen   session_open   = 20;
    SessionAttach session_attach = 21;
    SessionList   session_list   = 22;
    SessionGet    session_get    = 23;
    SessionResize session_resize = 24;
    SessionClose  session_close  = 26;
    SessionRead   session_read   = 27;
    SessionWrite  session_write  = 28;

    ExecStart     exec_start     = 30;

    // Tunnel control (M4). Both requests are authorized against the ACL
    // action in CLI.md §2.5 (forward.local / forward.remote) before any
    // resource — listener bind, dial — is created (CLAUDE.md "Never create
    // a resource ... before authorization succeeds"). Realizes the tags
    // this oneof's header comment reserved for exactly these messages.
    RemoteForwardOpen  rfwd_open  = 40;
    RemoteForwardClose rfwd_close = 41;

    Ping          ping           = 50;
    Pong          pong           = 51;

    // Asynchronous (request_id = 0), host → attached client.
    SessionEvent  session_event  = 60;

    // One-time invite-code pairing (ADR-0002, M7 Step 4,
    // docs/design/protocol.md §15). Sent only on a connection whose
    // principal is Principal::Pairing — the host's connection dispatcher
    // routes such a connection to a dedicated, minimal responder before it
    // ever reaches Hello/session/tunnel/exec dispatch (protocol.md §15's
    // "no resource before verification" invariant); a PairingProof
    // arriving on an ordinary, already-authenticated connection is refused
    // (INVALID_ARGUMENT) the same way an out-of-place Hello already is,
    // above.
    PairingProof     pairing_proof     = 70;
    PairingAccepted  pairing_accepted  = 71;
  }
}

// Sent by both sides as the very first control message after the TLS
// handshake. Identity is *never* taken from this message — the principal is
// bound to the connection from the peer certificate (protocol.md §3).
message Hello {
  // Minor versions supported within this major (ALPN) version. Peers adopt
  // the intersection; an empty intersection is a fatal UNSUPPORTED.
  repeated uint32 versions = 1;
  // Display-only device name.
  string device_name = 2;
  // Capability strings; peers adopt the intersection ("exec", "session", ...).
  repeated string capabilities = 3;
  // Present only when the sender is a reverse target registering itself as
  // a host on this connection (M3, protocol.md §11-2); absent on every
  // other Hello (including a plain `qsh serve` responder's Hello, and a
  // dialer's Hello that is not registering).
  ReverseRegistration reverse = 4;
}

// A reverse target's self-announcement, carried once in `Hello.reverse`.
// Both fields are self-reported by the dialer, exactly like `device_name`
// above — the controller authenticates the connection from the peer
// certificate first (protocol.md §3) and only then looks at this message;
// neither field is ever an authorization or identity input.
message ReverseRegistration {
  // The name this target would like to be registered under. NEVER used for
  // authentication or name resolution on its own — the controller honors it
  // only when the peer has no trust-store alias and
  // `[listen].allow_advertised_names` is set (protocol.md §11-2); otherwise
  // a compromised or merely careless target could squat another device's
  // name (name-squatting). Shape-checked with
  // `name.is_empty() || wire::valid_host_name(name)` before this string
  // reaches an ACL decision or an audit record — empty is exempt from the
  // check (it means "let the controller pick"), a non-empty value must
  // satisfy `wire::valid_host_name`.
  string offered_name = 1;
  // Capability strings this target is offering *in its host role for this
  // registration* — a distinct list from `Hello.capabilities` (the
  // connection's general capabilities). Empty means "same as
  // Hello.capabilities". Unknown strings are ignored by the controller.
  // Recorded in the reverse registry as metadata only: M3 never exposes
  // this in JSON and never treats it as an authorization or identity
  // input. The first consumer is M4 (tunnel capability negotiation).
  repeated string capabilities = 2;
}

// The reply to a request. Exactly one body variant is set: either the typed
// success payload matching the request, or Error.
message Response {
  oneof body {
    SessionOpened     session_opened      = 1;  // session_open
    SessionAttached   session_attached    = 2;  // session_attach
    ExecStarted       exec_started        = 3;  // exec_start
    // Realizes the tag this oneof's header comment reserved for exactly
    // this message (M4).
    RemoteForwardOpened rfwd_opened       = 4;  // rfwd_open
    SessionReadResult session_read_result = 5;  // session_read
    SessionListResult session_list_result = 6;  // session_list
    SessionInfo       session_info        = 7;  // session_get
    SessionWritten    session_written     = 8;  // session_write
    SessionResized    session_resized     = 9;  // session_resize
    SessionClosed     session_closed      = 10; // session_close
    Error             error               = 15;
  }
}

// Failure payload. `code` is one of the docs/CLI.md §3.3 strings
// (INVALID_ARGUMENT, PERMISSION_DENIED, ...) — the same vocabulary as
// qsh-proto's ErrorCode; unknown codes are passed through by receivers.
message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// The initiator's (`qsh trust accept`) one and only message on a
// pairing-authenticated connection's control stream (ADR-0002,
// docs/design/protocol.md §15). Unlike Hello, this is never answered with a
// second PairingProof — the responder answers either PairingAccepted
// (success) or an Error frame (any failure: no live invite matches, the
// matching invite has expired, or it was already consumed), then the
// connection is closed either way. Never a Request/Response pair through
// the `Response` oneof above — pairing intentionally keeps its own, smaller
// message shape (protocol.md §15's "keep the schema conservative" note).
message PairingProof {
  // Label for the pin this creates on the responder's side, self-reported
  // exactly like Hello.device_name — never an authentication input on its
  // own (protocol.md §3's rule applies here too: identity is the connection
  // principal / the proof below, never a wire string).
  string device_name = 1;
  // BLAKE3 keyed hash, 32 bytes: `blake3::keyed_hash(mac_key, exporter ||
  // 0x01)` where `mac_key = blake3::hash(invite_secret)` and `exporter` is
  // this connection's own `quinn::Connection::export_keying_material`
  // output under the label/context docs/design/protocol.md §15 fixes (the
  // channel-binding property invariant: a MITM terminating two separate TLS
  // sessions gets two different exporter values, so a proof valid on one
  // leg never verifies on the other). The trailing `0x01` domain-separates
  // this direction's proof from PairingAccepted.proof's `0x02` below —
  // see that field's own comment for why this matters.
  bytes proof = 2;
}

// The responder's reply to a successfully verified PairingProof — the only
// success reply on a pairing connection (ADR-0002, protocol.md §15). Any
// failure instead sends the existing Error frame above (AUTH_FAILED /
// TRUST_REQUIRED / SESSION_CONFLICT depending on why, docs/CLI.md §3.3).
message PairingAccepted {
  // The responder's own device name (the same value its ordinary
  // Hello.device_name carries), for the initiator's own pin.
  string device_name = 1;
  // The responder's own proof, over the same channel: `blake3::keyed_hash(
  // mac_key, exporter || 0x02)` — domain-separated from PairingProof.proof
  // (`|| 0x01`) so it cannot be produced by trivially echoing the bytes the
  // initiator just sent. This is what makes the exchange bidirectional
  // rather than server-blind: the initiator's own trust evaluator for this
  // one-shot dial accepts *any* certificate (`crate::pairing::
  // AcceptAnyForPairing` in qsh-core — the secret is the actual credential,
  // not the TLS identity), so without an independently-derived value here,
  // any endpoint the initiator happened to dial could reply
  // PairingAccepted unconditionally and have its fingerprint pinned as if
  // it were the invited device. The initiator MUST verify this
  // constant-time before pinning the responder — never pin on the strength
  // of the message arriving at all.
  bytes proof = 2;
}

// Request: run a non-PTY command on the peer (op `exec.run`).
message ExecStart {
  // Program + arguments, executed directly (no shell re-interpretation).
  repeated string argv = 1;
  // Extra environment variables layered over the executor's environment.
  map<string, string> env = 2;
  // 0 = no timeout. When exceeded the executor kills the child.
  uint64 timeout_ms = 3;
}

// Success payload for ExecStart. `ticket` authorizes exactly one EXEC_DATA
// stream (single use, short expiry) and is only ever issued after the ACL
// check passed (protocol.md §7).
message ExecStarted {
  string exec_id = 1;
  bytes ticket = 2;
}

// ---------------------------------------------------------------------------
// Tunnel control messages (M4, `docs/CLI.md` §6.9). `forward_id` is an
// opaque, URL-safe id issued by the host for a bound remote listener — same
// shape discipline as `session_id` (`wire::valid_forward_id`), because it
// becomes an ACL resource and an audit field the moment a peer sends it
// back. It is carried again in `StreamHeader.ticket` on the `TCP_ACCEPTED`
// stream the host opens for each accepted connection (§9 comment above
// `StreamHeader`).
// ---------------------------------------------------------------------------

// Request: open a `-R` remote-forward listener on the peer (op
// `tunnel.open`, ACL `forward.remote`). The host binds `bind_host:bind_port`
// and, for each connection it accepts there, opens a `TCP_ACCEPTED`
// data stream back to the requester; the requester dials
// `forward_host:forward_port` for that stream (protocol.md §7, §9 — the
// requester is the dialing side on this leg, the reverse of `-L`).
// Non-loopback `bind_host` is *shape*-valid (this message does not encode
// policy); the host enforces loopback-only before binding
// (`docs/PRD.md` §9, PLAN.md M4 §4.1 #5).
message RemoteForwardOpen {
  string bind_host = 1;
  uint32 bind_port = 2;
  string forward_host = 3;
  uint32 forward_port = 4;
  // Opaque, requester-minted claim credential for the reverse route's
  // `TCP_ACCEPTED` claim leg (`docs/design/protocol.md` §11-3,
  // adversarial-review finding A: claiming must check that the claiming
  // conduit is the registered owner, not merely that it knows a live
  // `forward_id`). Never inspected or compared by the target, and never
  // actually transmitted to it either (adversarial-review finding 5): this
  // field exists solely for the requester-side `qsh listen` daemon
  // (`crate::reverse::listen::ControlHub::send_request`) to capture and
  // seat atomically alongside the registration itself
  // (`ControlHub::deliver_response`), closing the window a token seated
  // lazily on the first `claim_tcp_accepted` call would otherwise leave
  // open to a same-uid adversary that calls first. `send_request`
  // `mem::take`s it out of this message the moment it captures it, before
  // the (now-empty-here) `body` is ever handed to the outbound channel
  // `Listen::drive_registered_session` actually serializes onto the QUIC
  // connection — so the bytes that reach the peer never carry it,
  // regardless of what the requesting CLI process originally sent.
  //
  // Kept on this message rather than moved onto a genuinely local-only
  // one: `LOCAL_CONTROL` has no message shape of its own to carry it on
  // instead — that conduit relays the *exact* `ControlMessage`/`Response`
  // pair that crosses the QUIC control stream, verbatim, in both
  // directions (`qsh/local/v1.proto`'s own header paragraph on
  // `LOCAL_CONTROL`; `LocalctlDaemon::serve_control`'s
  // `conduit.recv::<wire::ControlMessage>()` has no per-body-variant
  // branch to hang a separate local envelope off of). Giving this one
  // field a side channel would mean inventing a new discriminator on that
  // conduit for it alone — a real protocol change, not a field move, and
  // one that would need its own design pass rather than riding in on a
  // hygiene fix. Empty on the forward (direct-connect) route, which never
  // touches `ControlHub` at all.
  bytes claim_token = 5;
}

// Success payload for RemoteForwardOpen. `actual_port` is the kernel-chosen
// port when `bind_port` was 0.
message RemoteForwardOpened {
  string forward_id = 1;
  uint32 actual_port = 2;
}

// Request: close a previously-opened remote forward (op `tunnel.close`,
// same ownership check as every `tunnel.*` op, CLI.md §2.5). Answered with
// a bare success `Response` (no dedicated payload) or `Error`.
message RemoteForwardClose {
  string forward_id = 1;
}

// ---------------------------------------------------------------------------
// Session control messages (M2). `session_id` is an opaque, URL-safe id
// issued by the host; the client-side `session_ref` (`<alias>/<session_id>`)
// never appears on the wire (ADR-0007). Timestamps are RFC 3339 UTC strings,
// the same representation the JSON contract uses (CLI.md §2.3).
// ---------------------------------------------------------------------------

// Request: create a PTY session (op `session.open`, ACL `session.open`).
message SessionOpen {
  // Program + arguments, executed directly. Empty = the account's login
  // shell.
  repeated string argv = 1;
  // Extra environment layered over the login-shell environment.
  map<string, string> env = 2;
  // TERM to export; empty = host default.
  string term = 3;
  // Initial window size; 0 = host default.
  uint32 cols = 4;
  uint32 rows = 5;
  // The `user` half of `qsh user@host` — a *hint*, never an identity. The
  // host checks it after the ACL decision and before spawn: if it differs
  // from the serve account's login name the request fails UNSUPPORTED
  // without creating a session (CLI.md §7).
  optional string user = 6;
}

// Success payload for SessionOpen. `ticket` authorizes exactly one
// SESSION_DATA stream (single use, 30 s). `resume_token` is the 32-byte
// CSPRNG credential of protocol.md §10 — the client stores it in
// resume.json and never surfaces it in JSON (ADR-0007).
message SessionOpened {
  string session_id = 1;
  bytes resume_token = 2;
  bytes ticket = 3;
  // Cumulative output byte offset at creation (0 for a fresh session).
  uint64 initial_seq = 4;
  // RFC 3339: when the session/token TTL lapses (client-side cleanup).
  string expires_at = 5;
}

// Whether an attach wants to write. Only an explicit ATTACH_MODE_RW asks
// for the writer lease; UNSPECIFIED (the proto3 default, i.e. an unset
// field) is INVALID_ARGUMENT, never treated as RW.
enum AttachMode {
  ATTACH_MODE_UNSPECIFIED = 0;
  ATTACH_MODE_RW = 1;
  // Number reserved for a later milestone; M2 hosts answer INVALID_ARGUMENT
  // — there is no observer/read-only attach in M2 (ROADMAP §3).
  ATTACH_MODE_RO = 2;
}

// Request: (re)attach to a session (stream op `session.attach`, ACL
// `session.attach`). Checked in order: token hash + expiry → peer
// fingerprint bound to the session → ACL; only then is a ticket issued.
message SessionAttach {
  string session_id = 1;
  bytes resume_token = 2;
  // Highest cumulative output offset the client already has (protocol.md
  // §8); replay resumes exactly after it.
  uint64 last_output_seq = 3;
  AttachMode mode = 4;
  // RW only: fail with SESSION_CONFLICT instead of stealing a live lease.
  bool no_steal = 5;
}

// Success payload for SessionAttach. The presented token is dead; the
// client must durably store `new_resume_token` before using the ticket.
message SessionAttached {
  bytes ticket = 1;
  bytes new_resume_token = 2;
  // Offset replay will actually start from (== last_output_seq unless the
  // ring evicted it, in which case the data stream opens with a Gap).
  uint64 replay_from = 3;
  // True when this attach holds the writer lease.
  bool writer_lease = 4;
  string expires_at = 5;
  // Cumulative *input* offset this attach continues from (protocol.md §8,
  // §10-5). A resumed attach gets the offset the host has applied on the
  // input stream it left, so its retransmitted tail is deduplicated; any
  // other attach gets 0 and counts from scratch. Additive field 6.
  uint64 input_seq = 6;
}

// Request: list this host's sessions (op `session.list`, ACL `session.list`).
message SessionList {}

// Success payload for SessionList.
message SessionListResult {
  repeated SessionInfo sessions = 1;
}

// Request: one session's info (op `session.get`, ACL `session.list`).
message SessionGet {
  string session_id = 1;
}

// Wire view of a session. The JSON `Session` (CLI.md §5) is this plus the
// client-only `session_ref`/`host` fields that Ops fills in (ADR-0007).
message SessionInfo {
  string session_id = 1;
  // Open string set: "running", "exited", ... (CLI.md §10).
  string state = 2;
  // Principal string of the writer-lease holder; absent = no holder.
  optional string writer = 3;
  // RFC 3339 creation time.
  string created_at = 4;
  // Cumulative output byte offset so far.
  uint64 last_sequence = 5;
}

// Request: resize a session's PTY without being attached (op
// `session.resize`, ACL `session.control`).
message SessionResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// Success payload for SessionResize: the size the host actually applied
// to the PTY (may differ from the request if the host clamps).
message SessionResized {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Request: terminate the session's process group and remove the session
// (op `session.close`, ACL `session.control`).
message SessionClose {
  string session_id = 1;
  // Optional first signal of the HUP → TERM → KILL escalation, canonical
  // "SIGTERM" form; one of HUP|INT|QUIT|TERM|USR1|USR2|KILL (CLI.md §6.7).
  optional string signal = 2;
}

// Success payload for SessionClose.
message SessionClosed {
  // Cumulative output offset at removal.
  uint64 final_seq = 1;
}

// Request: one cursor pull of session events (op `session.read`, ACL
// `session.attach`; no resume token needed).
message SessionRead {
  string session_id = 1;
  // Cumulative output offset already consumed (`--after`).
  uint64 after = 2;
  // Payload cap for this pull; 0 = host default. The host clamps to
  // SESSION_READ_MAX_BYTES so the reply always fits one control frame.
  uint64 max_bytes = 3;
  // Long-poll wait when nothing is available; 0 = return immediately.
  uint64 wait_ms = 4;
  // Control-entry cursor: id of the last zero-length control entry the
  // caller received (`next_ctl_after` of the previous reply); 0 = none yet.
  // Control entries do not advance `after`, so without this a caller
  // re-reading at the same offset would be handed the same control entry
  // for ever (protocol.md §9).
  uint64 ctl_after = 5;
}

// Success payload for SessionRead: events in total order (output chunks
// interleaved with the zero-length control entries of the replay ring).
message SessionReadResult {
  repeated SessionReadEvent events = 1;
  // The cursor to resume from: feed both back as `after` / `ctl_after`.
  // `next_after` equals the request's `after` plus the output bytes
  // delivered (or `available_from` after a gap).
  uint64 next_after = 2;
  uint64 next_ctl_after = 3;
}

// One event of a SessionReadResult. Mirrors qsh.event/v1 (CLI.md §6.4).
message SessionReadEvent {
  oneof body {
    Output        output         = 1;
    Gap           gap            = 2;
    Exit          exit           = 3;
    WriterChanged writer_changed = 4;
    Closed        closed         = 5;
  }
}

// Request: inject input into a session without being attached (op
// `session.write`, ACL `session.control`). `data` ≤ SESSION_CHUNK_MAX per
// message; the client splits larger writes into several requests.
message SessionWrite {
  string session_id = 1;
  bytes data = 2;
}

// Success payload for SessionWrite.
message SessionWritten {
  // Bytes the host actually accepted into the PTY input (≤ len(data)).
  uint64 bytes_written = 1;
}

// Asynchronous host → client notification for a session the connection is
// attached to (request_id = 0). Pull consumers see the same events as
// control entries in SessionReadResult.
message SessionEvent {
  string session_id = 1;
  oneof body {
    Exit          exited         = 2;
    WriterChanged writer_changed = 3;
    Closed        closed         = 4;
  }
}

// The writer lease changed hands. `new_writer` absent = lease released
// with no holder (owning connection died).
message WriterChanged {
  optional string new_writer = 1;
  // Cumulative output offset at the moment of the change.
  uint64 seq = 2;
}

// The session was removed from the broker; always the last event.
message Closed {
  // Open string set: "closed" | "exit" | "ttl_expired" (CLI.md §6.4).
  string reason = 1;
  uint64 seq = 2;
}

// Application-level liveness probe (QUIC keep-alive handles the transport).
message Ping {}
message Pong {}

// ---------------------------------------------------------------------------
// Non-control streams: the first frame is always a StreamHeader.
// ---------------------------------------------------------------------------

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  SESSION_DATA = 1;
  EXEC_DATA = 2;
  TCP_CONNECT = 3;
  TCP_ACCEPTED = 4;
}

message StreamHeader {
  StreamKind kind = 1;
  // SESSION_DATA / EXEC_DATA: the ticket from the corresponding response.
  // TCP_ACCEPTED: forward_id.
  bytes ticket = 2;
  // TCP_CONNECT only.
  string host = 3;
  uint32 port = 4;
}

// ---------------------------------------------------------------------------
// Tunnel data streams (M4). A `TCP_CONNECT` stream (opened by the dialing
// side named in `StreamHeader.host`/`port`) carries exactly one
// `ConnectResult` as its first frame after `StreamHeader`, framed the same
// way as every other data-stream message (§5: u32-BE length prefix + prost,
// under `DATA_FRAME_MAX`). After an `ok` result the stream immediately
// becomes a raw, unframed byte splice in both directions — no further
// `ConnectResult`, no further length prefixes, protocol.md §7. A
// `TCP_ACCEPTED` stream carries no `ConnectResult`: it *is* the accepted
// leg, opened only after the peer already knows the accept succeeded.
// ---------------------------------------------------------------------------

message ConnectResult {
  bool ok = 1;
  // Empty when `ok`. CLI.md §3.3 vocabulary: a failed dial is
  // `CONNECTION_FAILED`; an inline ACL rejection (protocol.md §7's ticket
  // exception for `TCP_CONNECT`) is `PERMISSION_DENIED`.
  string code = 2;
  string message = 3;
}

// ---------------------------------------------------------------------------
// Session data stream (one per attach). Resumable: `sequence`/`input_seq`
// are cumulative byte offsets (protocol.md §8), so replay can restart at an
// exact byte and the client can drop `sequence <= last_output_seq` frames.
// ---------------------------------------------------------------------------

message SessionFrame {
  oneof body {
    Output   output    = 1;
    Input    input     = 2;
    InputAck input_ack = 3;
    Gap      gap       = 4;
    Resize   resize    = 5;
    Exit     exit      = 6;
  }
}

// Host → client output chunk, ≤ SESSION_CHUNK_MAX (16 KiB). `sequence` is
// the cumulative offset *after* this chunk (last byte offset + 1).
message Output {
  uint64 sequence = 1;
  bytes data = 2;
}

// Client → host input chunk, ≤ SESSION_CHUNK_MAX. `input_seq` is the
// cumulative input offset after this chunk; the host discards chunks whose
// `input_seq` is at or below the offset it has already applied.
message Input {
  uint64 input_seq = 1;
  bytes data = 2;
}

// Host → client: highest cumulative input offset applied so far.
message InputAck {
  uint64 acked_input_seq = 1;
}

// Host → client, first frame after attach when the ring no longer holds
// `requested_after`; replay then continues from `available_from`.
message Gap {
  uint64 requested_after = 1;
  uint64 available_from = 2;
}

// Client → host window-size change.
message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Host → client: the session's process exited. Also the payload of
// SessionEvent.exited and SessionReadEvent.exit.
message Exit {
  // Cumulative output offset at exit (all output precedes this frame).
  uint64 final_seq = 1;
  int32 exit_code = 2;
  optional string signal = 3;
}

// ---------------------------------------------------------------------------
// Exec data stream. Not resumable: no sequence numbers, relies on the
// stream's own reliable ordered delivery. ExecExit is always the last frame
// sent by the executor, after which it finishes the stream.
// ---------------------------------------------------------------------------

message ExecFrame {
  oneof body {
    Stdin    stdin     = 1;
    StdinEof stdin_eof = 2;
    Stdout   stdout    = 3;
    Stderr   stderr    = 4;
    ExecExit exec_exit = 5;
  }
}

// Payload chunks are ≤ EXEC_CHUNK_MAX (16 KiB) each.
message Stdin    { bytes data = 1; }
message StdinEof {}
message Stdout   { bytes data = 1; }
message Stderr   { bytes data = 1; }

message ExecExit {
  // Process exit status. When the child was terminated by a signal this is
  // 128 + signal number (shell convention) and `signal` names the signal.
  int32 exit_code = 1;
  optional string signal = 2;
  // True when the host killed the process because the requested
  // `ExecStart.timeout_ms` elapsed. The client reports this as TIMEOUT
  // rather than as a plain signal exit.
  bool timed_out = 3;
}
