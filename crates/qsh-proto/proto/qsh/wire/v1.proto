// QSH wire protocol, major version 1 (ALPN "qsh/1").
//
// This file is the reviewable, fuzzable grammar of every control/data
// message QSH puts on a QUIC stream (docs/design/protocol.md §6, §9).
// Rules:
//   * additive only within v1 — never renumber or reuse a field/tag;
//   * every message on the wire is wrapped by the u32-BE length-prefixed
//     frame layer in `qsh-proto/src/frame.rs` (§5);
//   * `Response.Error.code` uses the CLI.md §3.3 error-code strings verbatim.
//
// Scope so far: the M1 walking skeleton (Hello, Response/Error,
// ExecStart/ExecStarted, StreamHeader, ExecFrame, Ping/Pong) plus the M2
// session surface (session_* control messages, SessionEvent, SessionFrame).
// Tunnel (M4) and reverse (M3) tags are `reserved` here so a later
// milestone cannot accidentally take them for something else — protoc /
// protox reject a field that reuses a reserved number.

syntax = "proto3";

package qsh.wire.v1;

// ---------------------------------------------------------------------------
// Control stream (one per connection, bidirectional RPC, role-symmetric).
// ---------------------------------------------------------------------------

// Every control-stream frame decodes to exactly one ControlMessage.
// Requests carry a non-zero request_id; the matching Response echoes it.
// Asynchronous events use request_id = 0.
message ControlMessage {
  uint64 request_id = 1;
  // 25 was SessionSignal in early sketches; it is P1 and deliberately left
  //    undefined in v1 (a host answers UNSUPPORTED to it, CLI.md §2.4).
  // 40–41 are RemoteForwardOpen/Close (M4).
  reserved 25, 40, 41;
  oneof body {
    Hello         hello          = 10;
    Response      response       = 11;

    // Session control (M2). Every session_* request is authorized against
    // the ACL action in CLI.md §2.5 before any resource exists.
    SessionOpen   session_open   = 20;
    SessionAttach session_attach = 21;
    SessionList   session_list   = 22;
    SessionGet    session_get    = 23;
    SessionResize session_resize = 24;
    SessionClose  session_close  = 26;
    SessionRead   session_read   = 27;
    SessionWrite  session_write  = 28;

    ExecStart     exec_start     = 30;

    Ping          ping           = 50;
    Pong          pong           = 51;

    // Asynchronous (request_id = 0), host → attached client.
    SessionEvent  session_event  = 60;
  }
}

// Sent by both sides as the very first control message after the TLS
// handshake. Identity is *never* taken from this message — the principal is
// bound to the connection from the peer certificate (protocol.md §3).
message Hello {
  // Minor versions supported within this major (ALPN) version. Peers adopt
  // the intersection; an empty intersection is a fatal UNSUPPORTED.
  repeated uint32 versions = 1;
  // Display-only device name.
  string device_name = 2;
  // Capability strings; peers adopt the intersection ("exec", "session", ...).
  repeated string capabilities = 3;
  // 4 is `ReverseRegistration reverse` (M3, protocol.md §11).
  reserved 4;
}

// The reply to a request. Exactly one body variant is set: either the typed
// success payload matching the request, or Error.
message Response {
  // 4 is `RemoteForwardOpened rfwd_opened` (M4).
  reserved 4;
  oneof body {
    SessionOpened     session_opened      = 1;  // session_open
    SessionAttached   session_attached    = 2;  // session_attach
    ExecStarted       exec_started        = 3;  // exec_start
    SessionReadResult session_read_result = 5;  // session_read
    SessionListResult session_list_result = 6;  // session_list
    SessionInfo       session_info        = 7;  // session_get
    SessionWritten    session_written     = 8;  // session_write
    SessionResized    session_resized     = 9;  // session_resize
    SessionClosed     session_closed      = 10; // session_close
    Error             error               = 15;
  }
}

// Failure payload. `code` is one of the docs/CLI.md §3.3 strings
// (INVALID_ARGUMENT, PERMISSION_DENIED, ...) — the same vocabulary as
// qsh-proto's ErrorCode; unknown codes are passed through by receivers.
message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// Request: run a non-PTY command on the peer (op `exec.run`).
message ExecStart {
  // Program + arguments, executed directly (no shell re-interpretation).
  repeated string argv = 1;
  // Extra environment variables layered over the executor's environment.
  map<string, string> env = 2;
  // 0 = no timeout. When exceeded the executor kills the child.
  uint64 timeout_ms = 3;
}

// Success payload for ExecStart. `ticket` authorizes exactly one EXEC_DATA
// stream (single use, short expiry) and is only ever issued after the ACL
// check passed (protocol.md §7).
message ExecStarted {
  string exec_id = 1;
  bytes ticket = 2;
}

// ---------------------------------------------------------------------------
// Session control messages (M2). `session_id` is an opaque, URL-safe id
// issued by the host; the client-side `session_ref` (`<alias>/<session_id>`)
// never appears on the wire (ADR-0007). Timestamps are RFC 3339 UTC strings,
// the same representation the JSON contract uses (CLI.md §2.3).
// ---------------------------------------------------------------------------

// Request: create a PTY session (op `session.open`, ACL `session.open`).
message SessionOpen {
  // Program + arguments, executed directly. Empty = the account's login
  // shell.
  repeated string argv = 1;
  // Extra environment layered over the login-shell environment.
  map<string, string> env = 2;
  // TERM to export; empty = host default.
  string term = 3;
  // Initial window size; 0 = host default.
  uint32 cols = 4;
  uint32 rows = 5;
  // The `user` half of `qsh user@host` — a *hint*, never an identity. The
  // host checks it after the ACL decision and before spawn: if it differs
  // from the serve account's login name the request fails UNSUPPORTED
  // without creating a session (CLI.md §7).
  optional string user = 6;
}

// Success payload for SessionOpen. `ticket` authorizes exactly one
// SESSION_DATA stream (single use, 30 s). `resume_token` is the 32-byte
// CSPRNG credential of protocol.md §10 — the client stores it in
// resume.json and never surfaces it in JSON (ADR-0007).
message SessionOpened {
  string session_id = 1;
  bytes resume_token = 2;
  bytes ticket = 3;
  // Cumulative output byte offset at creation (0 for a fresh session).
  uint64 initial_seq = 4;
  // RFC 3339: when the session/token TTL lapses (client-side cleanup).
  string expires_at = 5;
}

// Whether an attach wants to write. RO attaches never take the writer lease.
enum AttachMode {
  ATTACH_MODE_UNSPECIFIED = 0;
  ATTACH_MODE_RW = 1;
  ATTACH_MODE_RO = 2;
}

// Request: (re)attach to a session (stream op `session.attach`, ACL
// `session.attach`). Checked in order: token hash + expiry → peer
// fingerprint bound to the session → ACL; only then is a ticket issued.
message SessionAttach {
  string session_id = 1;
  bytes resume_token = 2;
  // Highest cumulative output offset the client already has (protocol.md
  // §8); replay resumes exactly after it.
  uint64 last_output_seq = 3;
  AttachMode mode = 4;
  // RW only: fail with SESSION_CONFLICT instead of stealing a live lease.
  bool no_steal = 5;
}

// Success payload for SessionAttach. The presented token is dead; the
// client must durably store `new_resume_token` before using the ticket.
message SessionAttached {
  bytes ticket = 1;
  bytes new_resume_token = 2;
  // Offset replay will actually start from (== last_output_seq unless the
  // ring evicted it, in which case the data stream opens with a Gap).
  uint64 replay_from = 3;
  // True when this attach holds the writer lease.
  bool writer_lease = 4;
  string expires_at = 5;
}

// Request: list this host's sessions (op `session.list`, ACL `session.list`).
message SessionList {}

// Success payload for SessionList.
message SessionListResult {
  repeated SessionInfo sessions = 1;
}

// Request: one session's info (op `session.get`, ACL `session.list`).
message SessionGet {
  string session_id = 1;
}

// Wire view of a session. The JSON `Session` (CLI.md §5) is this plus the
// client-only `session_ref`/`host` fields that Ops fills in (ADR-0007).
message SessionInfo {
  string session_id = 1;
  // Open string set: "running", "exited", ... (CLI.md §10).
  string state = 2;
  // Principal string of the writer-lease holder; absent = no holder.
  optional string writer = 3;
  // RFC 3339 creation time.
  string created_at = 4;
  // Cumulative output byte offset so far.
  uint64 last_sequence = 5;
}

// Request: resize a session's PTY without being attached (op
// `session.resize`, ACL `session.control`).
message SessionResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// Success payload for SessionResize.
message SessionResized {}

// Request: terminate the session's process group and remove the session
// (op `session.close`, ACL `session.control`).
message SessionClose {
  string session_id = 1;
  // Optional first signal of the HUP → TERM → KILL escalation, canonical
  // "SIGTERM" form; one of HUP|INT|QUIT|TERM|USR1|USR2|KILL (CLI.md §6.7).
  optional string signal = 2;
}

// Success payload for SessionClose.
message SessionClosed {
  // Cumulative output offset at removal.
  uint64 final_seq = 1;
}

// Request: one cursor pull of session events (op `session.read`, ACL
// `session.attach`; no resume token needed).
message SessionRead {
  string session_id = 1;
  // Cumulative output offset already consumed (`--after`).
  uint64 after = 2;
  // Payload cap for this pull; 0 = host default.
  uint32 max_bytes = 3;
  // Long-poll wait when nothing is available; 0 = return immediately.
  uint64 wait_ms = 4;
}

// Success payload for SessionRead: events in total order (output chunks
// interleaved with the zero-length control entries of the replay ring).
message SessionReadResult {
  repeated SessionReadEvent events = 1;
}

// One event of a SessionReadResult. Mirrors qsh.event/v1 (CLI.md §6.4).
message SessionReadEvent {
  oneof body {
    Output        output         = 1;
    Gap           gap            = 2;
    Exit          exit           = 3;
    WriterChanged writer_changed = 4;
    Closed        closed         = 5;
  }
}

// Request: inject input into a session without being attached (op
// `session.write`, ACL `session.control`). `data` ≤ SESSION_CHUNK_MAX per
// message; the client splits larger writes into several requests.
message SessionWrite {
  string session_id = 1;
  bytes data = 2;
}

// Success payload for SessionWrite.
message SessionWritten {}

// Asynchronous host → client notification for a session the connection is
// attached to (request_id = 0). Pull consumers see the same events as
// control entries in SessionReadResult.
message SessionEvent {
  string session_id = 1;
  oneof body {
    Exit          exited         = 2;
    WriterChanged writer_changed = 3;
    Closed        closed         = 4;
  }
}

// The writer lease changed hands. `new_writer` absent = lease released
// with no holder (owning connection died).
message WriterChanged {
  optional string new_writer = 1;
  // Cumulative output offset at the moment of the change.
  uint64 seq = 2;
}

// The session was removed from the broker; always the last event.
message Closed {
  // Open string set: "closed" | "exit" | "ttl_expired" (CLI.md §6.4).
  string reason = 1;
  uint64 seq = 2;
}

// Application-level liveness probe (QUIC keep-alive handles the transport).
message Ping {}
message Pong {}

// ---------------------------------------------------------------------------
// Non-control streams: the first frame is always a StreamHeader.
// ---------------------------------------------------------------------------

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  SESSION_DATA = 1;
  EXEC_DATA = 2;
  TCP_CONNECT = 3;
  TCP_ACCEPTED = 4;
}

message StreamHeader {
  StreamKind kind = 1;
  // SESSION_DATA / EXEC_DATA: the ticket from the corresponding response.
  // TCP_ACCEPTED: forward_id.
  bytes ticket = 2;
  // TCP_CONNECT only.
  string host = 3;
  uint32 port = 4;
}

// ---------------------------------------------------------------------------
// Session data stream (one per attach). Resumable: `sequence`/`input_seq`
// are cumulative byte offsets (protocol.md §8), so replay can restart at an
// exact byte and the client can drop `sequence <= last_output_seq` frames.
// ---------------------------------------------------------------------------

message SessionFrame {
  oneof body {
    Output   output    = 1;
    Input    input     = 2;
    InputAck input_ack = 3;
    Gap      gap       = 4;
    Resize   resize    = 5;
    Exit     exit      = 6;
  }
}

// Host → client output chunk, ≤ SESSION_CHUNK_MAX (16 KiB). `sequence` is
// the cumulative offset *after* this chunk (last byte offset + 1).
message Output {
  uint64 sequence = 1;
  bytes data = 2;
}

// Client → host input chunk, ≤ SESSION_CHUNK_MAX. `input_seq` is the
// cumulative input offset after this chunk; the host discards chunks whose
// `input_seq` is at or below the offset it has already applied.
message Input {
  uint64 input_seq = 1;
  bytes data = 2;
}

// Host → client: highest cumulative input offset applied so far.
message InputAck {
  uint64 acked_input_seq = 1;
}

// Host → client, first frame after attach when the ring no longer holds
// `requested_after`; replay then continues from `available_from`.
message Gap {
  uint64 requested_after = 1;
  uint64 available_from = 2;
}

// Client → host window-size change.
message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Host → client: the session's process exited. Also the payload of
// SessionEvent.exited and SessionReadEvent.exit.
message Exit {
  // Cumulative output offset at exit (all output precedes this frame).
  uint64 final_seq = 1;
  int32 exit_code = 2;
  optional string signal = 3;
}

// ---------------------------------------------------------------------------
// Exec data stream. Not resumable: no sequence numbers, relies on the
// stream's own reliable ordered delivery. ExecExit is always the last frame
// sent by the executor, after which it finishes the stream.
// ---------------------------------------------------------------------------

message ExecFrame {
  oneof body {
    Stdin    stdin     = 1;
    StdinEof stdin_eof = 2;
    Stdout   stdout    = 3;
    Stderr   stderr    = 4;
    ExecExit exec_exit = 5;
  }
}

// Payload chunks are ≤ EXEC_CHUNK_MAX (16 KiB) each.
message Stdin    { bytes data = 1; }
message StdinEof {}
message Stdout   { bytes data = 1; }
message Stderr   { bytes data = 1; }

message ExecExit {
  // Process exit status. When the child was terminated by a signal this is
  // 128 + signal number (shell convention) and `signal` names the signal.
  int32 exit_code = 1;
  optional string signal = 2;
  // True when the host killed the process because the requested
  // `ExecStart.timeout_ms` elapsed. The client reports this as TIMEOUT
  // rather than as a plain signal exit.
  bool timed_out = 3;
}
