// QSH local IPC protocol, package `qsh.local.v1` ("localctl").
//
// This is the protocol a CLI process speaks to *this machine's* resident
// `qsh listen` daemon over a Unix domain socket
// ($XDG_RUNTIME_DIR/qsh/<pid>.sock, mode 0600) — introduced in M3, first
// consumers `qsh hosts`/`qsh host get` and a reverse-host `qsh attach`
// (`docs/design/architecture.md` §3, `docs/design/protocol.md` §11-3).
//
// It is a *separate file and package* from `qsh.wire.v1` deliberately:
//
//   * `docs/ROADMAP.md` M8 freezes `qsh.wire.v1` as the remote,
//     externally-security-reviewed contract that crosses the network
//     between two QSH peers. Every message here stays on one machine, on a
//     socket only same-user local processes can even open — putting it in
//     the wire file would let a local-only refactor block on the freeze
//     that protects the actual remote attack surface.
//   * "§5와 동일한 frame layer" (protocol.md §11-3) means the *parser* is
//     shared: `qsh_proto::frame` (u32-BE length prefix + prost body,
//     `CONTROL_FRAME_MAX` — see `crate::local::encode_local`/`decode_local`)
//     runs unmodified over a `tokio::net::UnixStream`, exactly as it runs
//     over a QUIC control stream. It does not mean this file shares
//     `qsh.wire.v1`'s `.proto` source or tag numbering — the two are
//     independent grammars that happen to reuse the same envelope.
//   * `qsh-transport`'s quinn wrapper is *not* reused here — it is bound to
//     quinn connection/stream types and localctl is not a transport-layer
//     concern (`docs/design/architecture.md` §1 dependency direction:
//     `qsh-transport` is invisible to anything below the connection it
//     wraps).
//
// One-stream-per-connection ("conduit") model: each UDS connection is
// exactly one logical stream, and its very first frame — a `LocalHello` —
// declares what that connection is for (no separate local multiplexer is
// built; `docs/design/protocol.md` §14 / ADR-0005 already commit every QSH
// stream to declaring its own identity in-band, and this reuses that same
// discipline instead of inventing a second one):
//
//   * `LOCAL_CONTROL` — a control session for `LocalHello.host`. After the
//     `LocalHelloAck`, this connection carries the *exact same*
//     `qsh.wire.v1` `ControlMessage`/`Response` pair that would cross the
//     QUIC control stream to that host — the daemon relays each request
//     onto the live reverse connection and relays the answer back.
//   * `LOCAL_STREAM` — a data-stream conduit. The next frame after the
//     `LocalHelloAck` is a `qsh.wire.v1` `StreamHeader{SESSION_DATA,
//     ticket}`, exactly as it would be on a QUIC data stream. M4's tunnel
//     data streams reuse this same conduit kind rather than adding a new
//     one: `StreamHeader{TCP_CONNECT|TCP_ACCEPTED, ...}` flows over
//     `LOCAL_STREAM` exactly like `StreamHeader{SESSION_DATA}` does, because
//     `LOCAL_STREAM` already means "next frame is a wire `StreamHeader` data
//     stream" for any `StreamKind`, not just `SESSION_DATA`.
//   * `LOCAL_ADMIN` — a query about the daemon itself (`LocalHostList` and
//     friends), never forwarded to any registered host.
//
// `qsh.wire.v1`'s `StreamKind` enum gets no UDS-only value for any of this:
// stream identity is always the in-band header the receiver reads first, so
// a local-only kind has no reason to exist in the frozen remote vocabulary.
//
// Every daemon-to-client frame on a localctl conduit — whether it answers a
// `LOCAL_CONTROL`/`LOCAL_STREAM` `LocalHello` or a `LOCAL_ADMIN` request —
// is exactly one `LocalResponse`. This mirrors `qsh.wire.v1.Response`'s
// `oneof body` envelope deliberately: several structurally distinct
// success payloads (`LocalHelloAck{string,string,...}`,
// `LocalHostListResult{...}`) and a failure payload
// (`LocalError{string,string}`) that happen to share overlapping field
// shapes are not safely distinguishable on the wire without a
// discriminator — `LocalResponse` is that discriminator, so a caller never
// has to guess which reply type it received.
//
// **`LocalHelloAck` is a `LOCAL_CONTROL`/`LOCAL_STREAM`-only reply.** Both
// of those kinds name a specific registered host in `LocalHello.host`, and
// every field `LocalHelloAck` carries (`host`, `peer_fingerprint`,
// `generation`, `capabilities`) is a fact about that one host's live
// registration — see `LocalHelloAck`'s own doc. `LOCAL_ADMIN` is, by its
// own definition below, "never about any particular host": `LocalHello.host`
// is ignored for it, so there is no host for a `LocalHelloAck` to describe.
// A `LOCAL_ADMIN` conduit instead pipelines its `LocalHello` straight into
// the specific request that follows (e.g. `LocalHostList`) and answers with
// exactly one `LocalResponse` for that request — never a `LocalHelloAck`
// first. (`docs/design/protocol.md` §11-3 states this split explicitly;
// PR 5a's daemon/client implement and test it this way.)

syntax = "proto3";

package qsh.local.v1;

// First frame of every localctl connection; declares what the connection is
// for before anything else happens on it.
message LocalHello {
  uint32 version = 1;
  LocalStreamKind kind = 2;
  // Host alias this conduit is for (LOCAL_CONTROL / LOCAL_STREAM); ignored
  // for LOCAL_ADMIN, which is not about any particular host.
  string host = 3;
  // How long the caller is willing to wait for this request to be
  // satisfied, upper-bounded by `LOCAL_WAIT_MAX` (60 s, `crate::local`) —
  // the same clamp discipline as wire `SessionRead.wait_ms` /
  // `SESSION_READ_MAX_WAIT`: a ceiling, not a rejection, so one caller
  // cannot pin a daemon slot open indefinitely. What the daemon actually
  // waits for (e.g. a pending registration) is a later step's concern —
  // this field only carries the caller's request.
  uint32 wait_ms = 4;
  // The registration `generation` (`LocalHelloAck.generation`) this caller
  // already saw for `host`, if any (`docs/design/protocol.md` §11-4's
  // reverse Reattach mapping, `PLAN.md` M3 Step 8). Unset means "no
  // baseline — any live registration satisfies this," the existing
  // behavior every M3 Step 6/7 caller keeps by simply never setting this
  // field. Set means "wait for a registration strictly newer than this
  // one": a live hub at exactly `known_generation` does not satisfy the
  // wait, because that is the very connection `LocalReconnect` watched
  // die — a caller that has this field set is by definition retrying
  // after that generation's connection failed, and must never be handed
  // that same, already-dead generation back. Proto3 `optional` (explicit
  // field presence) rather than a plain `uint64` precisely because `0` is
  // a real generation (a host's very first registration) and must stay
  // distinguishable from "not set."
  optional uint64 known_generation = 5;
}

// What a localctl connection is for. `LOCAL_UNSPECIFIED` (the proto3
// default, i.e. an unset field) is deliberately invalid — exactly like
// `qsh.wire.v1.AttachMode.ATTACH_MODE_UNSPECIFIED` — so a caller must state
// its intent explicitly and the daemon never guesses it.
enum LocalStreamKind {
  LOCAL_UNSPECIFIED = 0;
  // A control session for `LocalHello.host`: relays `qsh.wire.v1`
  // `ControlMessage`/`Response` over this connection.
  LOCAL_CONTROL = 1;
  // A data-stream conduit: the next frame is a `qsh.wire.v1` `StreamHeader`.
  LOCAL_STREAM = 2;
  // A query about the daemon itself; never forwarded to any host.
  LOCAL_ADMIN = 3;
}

// The envelope for every daemon-to-client reply on a localctl conduit.
// Exactly one variant is set — never bare `LocalHelloAck` / `LocalError` /
// `LocalHostListResult` on the wire, so a reply frame is self-describing
// the same way `qsh.wire.v1.Response` is.
message LocalResponse {
  oneof body {
    LocalHelloAck hello_ack = 1;
    LocalHostListResult host_list_result = 2;
    // LOCAL_ADMIN reply to LocalTunnelList (M4, `qsh tunnels`).
    LocalTunnelListResult tunnel_list_result = 3;
    // LOCAL_STREAM reply to a `StreamHeader{TCP_ACCEPTED}` claim that the
    // daemon granted (M4 Step 5 PR 5a).
    LocalClaimGranted claim_granted = 4;
    // LOCAL_ADMIN reply to LocalTunnelClose (M4 Step 5 PR 5b, `qsh tunnel
    // close`).
    LocalTunnelCloseResult tunnel_close_result = 5;
    LocalError error = 15;
  }
}

// LOCAL_ADMIN request envelope (M4 Step 5 PR 5b) — the request-side twin
// of `LocalResponse`, existing for the same reason: `LocalHostList` and
// `LocalTunnelList` are both fieldless messages and therefore encode to
// the exact same zero bytes on the wire, so nothing about a frame's bytes
// can tell them apart without an explicit discriminator once a `LOCAL_ADMIN`
// conduit can be asked more than one kind of question. Every `LOCAL_ADMIN`
// conduit's second frame (after `LocalHello`) is exactly one
// `LocalAdminRequest`, never a bare `LocalHostList`/`LocalTunnelList`/
// `LocalTunnelClose` — mirrors `LocalResponse`'s own doc comment on this
// same discriminator problem, one direction earlier.
message LocalAdminRequest {
  oneof body {
    LocalHostList host_list = 1;
    LocalTunnelList tunnel_list = 2;
    LocalTunnelClose tunnel_close = 3;
  }
}

// The daemon's success reply to a `LOCAL_CONTROL`/`LOCAL_STREAM`
// `LocalHello` (never sent for `LOCAL_ADMIN` — see this file's header).
message LocalHelloAck {
  // The resolved host alias (echoes `LocalHello.host`).
  string host = 1;
  // SPKI SHA-256 fingerprint (`sha256:BASE64`) of the peer the daemon holds
  // this registration's live connection with. The CLI process is not
  // itself a TLS endpoint on that connection and so has no other way to
  // learn this value — without it, the resume fail-closed check
  // ADR-0007 requires ("Ops sends the resume token only when the connected
  // peer's SPKI fingerprint matches the stored entry's peer_spki_sha256")
  // would have nothing to compare against on the reverse path and would
  // silently stop happening.
  string peer_fingerprint = 2;
  // Registration generation (`docs/design/protocol.md` §11-4) at the
  // moment of this ack.
  uint64 generation = 3;
  // Capabilities the registered host is offering in its host role
  // (`ReverseRegistration.capabilities`, or `Hello.capabilities` when that
  // was empty).
  repeated string capabilities = 4;
}

// The daemon's failure reply to a `LocalHello` it could not satisfy.
// `code` is one of the `docs/CLI.md` §3.3 strings — the same vocabulary as
// `qsh.wire.v1.Error.code` and `qsh-proto`'s `ErrorCode` (never an ad hoc
// string of its own).
message LocalError {
  string code = 1;
  string message = 2;
}

// The daemon's success reply to a `LOCAL_STREAM`
// `StreamHeader{TCP_ACCEPTED, ticket=forward_id}` claim: this conduit has
// been spliced onto the claimed `TCP_ACCEPTED` QUIC stream, and every byte
// after this frame is that stream's raw payload
// (`docs/design/protocol.md` §11-3, "TCP_ACCEPTED claim leg의 요청/응답").
//
// Deliberately empty, and deliberately *sent at all*. Empty because the
// claimer already named the `forward_id` it asked for and the daemon knows
// nothing else about the connection — it never parses tunnel payload, so
// there is no fact it could carry here. Sent because the alternative —
// letting a granted claim be inferred from the daemon simply starting to
// pump raw bytes — is undecidable in both directions: any byte sequence
// can be read as a length prefix, so payload cannot be told apart from a
// frame by its content, and a granted claim onto an idle connection cannot
// be told apart from a slow failure by silence. This frame is the
// discriminator, exactly as `LocalResponse` itself is the discriminator
// between reply *types*. Failure keeps the existing `LocalError` path, so
// the claim leg's answer is always exactly one frame, never zero.
message LocalClaimGranted {}

// LOCAL_ADMIN request: list the daemon's currently-registered reverse
// hosts.
message LocalHostList {}

// Success reply to `LocalHostList`.
message LocalHostListResult {
  repeated LocalHost hosts = 1;
}

// One reverse-registered host as the daemon sees it — the daemon's internal
// admin view, distinct from the JSON `Host` type (`crate::types::Host`,
// `docs/CLI.md` §5); the client `Ops` layer maps between the two.
message LocalHost {
  string name = 1;
  string address = 2;
  // Open string set, e.g. `"reachable"` | `"stale"` (`docs/CLI.md` §5).
  string state = 3;
  // SPKI SHA-256 fingerprint, `sha256:BASE64`.
  string fingerprint = 4;
  repeated string capabilities = 5;
  uint64 generation = 6;
  // RFC 3339 UTC.
  string registered_at = 7;
}

// LOCAL_ADMIN request: list the tunnels this resident daemon currently
// holds (M4, `qsh tunnels` — the localctl consumer `docs/design/
// architecture.md` §3 already named for this query).
message LocalTunnelList {}

// Success reply to `LocalTunnelList`.
message LocalTunnelListResult {
  repeated LocalTunnel tunnels = 1;
}

// One tunnel as the daemon sees it — the daemon's internal admin view,
// distinct from the JSON `Tunnel` type (`crate::types::Tunnel`,
// `docs/CLI.md` §6.9); the client `Ops` layer maps between the two, adding
// `host` from its own local alias knowledge exactly as it does for
// `crate::types::Session` (ADR-0007).
message LocalTunnel {
  string tunnel_id = 1;
  // Open string set: `"local"` | `"remote"` (`docs/CLI.md` §6.9).
  string mode = 2;
  string bind = 3;
  string forward_to = 4;
  // 0 = not yet bound / not applicable.
  uint32 actual_port = 5;
  // Host alias this tunnel is on.
  string host = 6;
}

// LOCAL_ADMIN request: close a tunnel this resident daemon holds, by
// `tunnel_id` (== `forward_id` — `crate::types::Tunnel.tunnel_id`'s own
// doc on there being no second ID space). Only ever matches a `"remote"`
// mode forward: a `"local"` mode listener registers no `forward_id`
// daemon-side at all (`LocalTunnel.mode`'s own doc), so `tunnel.close` on
// one of those ids always answers `closed: false` here — closing that
// tunnel is instead just the opening CLI process exiting or being killed
// (`docs/CLI.md` §6.14's ordinary rule).
message LocalTunnelClose {
  string tunnel_id = 1;
}

// Success reply to LocalTunnelClose.
message LocalTunnelCloseResult {
  // `true` if a forward registration was found and closed; `false` if
  // `tunnel_id` named nothing this daemon currently holds (never
  // registered, already closed, or a `"local"` mode id) — idempotent, not
  // an error (`qsh_proto::TunnelCloseData::closed`'s own doc).
  bool closed = 1;
}
