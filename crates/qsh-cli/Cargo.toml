[package]
name = "qsh-cli"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "A QUIC-based direct-connect remote shell whose sessions survive IP changes, sleep and network switches. Installs the qsh binary."
keywords = ["quic", "remote-shell", "ssh", "terminal", "pty"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "qsh"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
qsh-core.workspace = true
qsh-proto.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

# Raw-mode terminal for the interactive TUI (`docs/design/architecture.md`
# §8). unix-only: `qsh-cli` is also built for `x86_64-pc-windows-msvc`, where
# the TUI path answers `UNSUPPORTED` instead (Windows client is P1).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "ioctl", "signal"] }

# jemalloc as the global allocator for the `qsh` serve/listener on glibc
# Linux, so freed pages return to the OS at idle via background purge
# threads. glibc pins the arena high-water instead — a 24h/100-session soak
# surfaced ~183 MiB retained idle RSS. glibc-Linux-only on purpose: the
# retention is glibc-specific (macOS's own allocator releases idle pages
# readily), and jemalloc's background_thread is unsupported on macOS —
# enabling it there prints a "<jemalloc>: option background_thread
# currently supports pthread only" line to stderr, which breaks the
# single-stderr-line CLI contract (docs/CLI.md §2.2).
# The allocator's fixed floor is pinned by malloc_conf in main.rs (narenas):
# jemalloc's default arena count follows the *detected* CPU count, which on a
# CI/container host is the host's, not the cgroup's — dozens of arenas whose
# metadata alone overran the PRD 30 MiB idle bound (docs/PRD.md:286).
# Narrowed to glibc: `tikv-jemalloc-sys` lists musl in its own
# `NO_BG_THREAD_TARGETS` (src/env.rs) and warns at build time that
# `background_threads_runtime_support` is unsupported there, while still
# configuring `background_thread:true`; `tikv-jemallocator`'s platform table
# has no musl row either. The retention this dependency exists for is
# glibc-arena-specific, so a musl build takes the system allocator rather
# than carry an allocator whose one feature the vendor does not support on
# that target. musl, macOS and Windows (client, P1) use the system
# allocator.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
qsh-testkit.workspace = true
# Test-only, direct transport-level types two integration-test files need
# and `qsh-core` does not re-export:
# - `crates/qsh-cli/tests/reverse_blackout.rs`: pins a `StaticTrust` for
#   `qsh_testkit::reverse::ReverseHarness`.
# - `crates/qsh-cli/tests/acl_check_equivalence.rs`: `AuthPath` (its
#   `Principal` usage comes from `qsh-core`'s own re-export instead,
#   `qsh-core/src/lib.rs`).
# A dev-dependency, so `xtask arch`'s manifest matrix (which reads only
# `[dependencies]`) does not see it — `qsh-cli`'s production code still
# never depends on `qsh-transport`.
qsh-transport.workspace = true

# The expect harness runs `qsh` itself under a pty so the termios path
# really executes (`docs/design/testing.md` L5).
[target.'cfg(unix)'.dev-dependencies]
expectrl.workspace = true
