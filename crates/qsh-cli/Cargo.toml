[package]
name = "qsh-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "qsh"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
qsh-core.workspace = true
qsh-proto.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# MCP adapter (`docs/design/architecture.md` §2/§8/§9, `docs/CLI.md` §8,
# `PLAN.md` M6 Step 1). Exact-pinned (not `3` or `3.1`): architecture.md §9
# risk 4 calls out rmcp's API churn explicitly and the mitigation is an
# exact version lock, not semver range trust. **`qsh-cli`-only** — never add
# this to `qsh-proto`/`qsh-transport`/`qsh-core` (architecture.md §1's
# dependency matrix has no lane for it below the frontend, and the MCP
# adapter is a `qsh-cli`-only frontend concern per §11). `default-features =
# false` + explicit `server`(tool routing, requires+enables `schemars`)
# + `transport-io`(stdio duplex, `docs/CLI.md` §8.1) is the minimum for a
# stdio-only server — no `client`/`auth`/HTTP transport surface, which this
# project never uses (MVP is stdio-only, §8.1).
rmcp = { version = "=3.1.4", default-features = false, features = [
    "server",
    "transport-io",
] }
# Tool input schemas are generated straight from `qsh-proto`'s `*Req` types
# (`docs/design/architecture.md` §2 "Req/Data 타입 공유") — production code,
# not just tests, so this moves out of `[dev-dependencies]` below. Same
# workspace-pinned `schemars = "1"` `qsh-proto` already derives against;
# rmcp 3.1.4 itself requires `schemars = "1.0"` (`rmcp-3.1.4/Cargo.toml`),
# so no version bump was needed (`Cargo.lock` already resolves schemars to
# 1.2.2, which `^1.0` and workspace `"1"` both accept).
schemars.workspace = true

# Raw-mode terminal for the interactive TUI (`docs/design/architecture.md`
# §8). unix-only: `qsh-cli` is also built for `x86_64-pc-windows-msvc`, where
# the TUI path answers `UNSUPPORTED` instead (Windows client is P1).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "ioctl", "signal"] }

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
qsh-testkit.workspace = true
# Test-only, direct transport-level types two integration-test files need
# and `qsh-core` does not re-export:
# - `crates/qsh-cli/tests/reverse_blackout.rs`: pins a `StaticTrust` for
#   `qsh_testkit::reverse::ReverseHarness`.
# - `crates/qsh-cli/tests/acl_check_equivalence.rs`: `AuthPath` (its
#   `Principal` usage comes from `qsh-core`'s own re-export instead,
#   `qsh-core/src/lib.rs`).
# A dev-dependency, so `xtask arch`'s manifest matrix (which reads only
# `[dependencies]`) does not see it — `qsh-cli`'s production code still
# never depends on `qsh-transport`.
qsh-transport.workspace = true

# The expect harness runs `qsh` itself under a pty so the termios path
# really executes (`docs/design/testing.md` L5).
[target.'cfg(unix)'.dev-dependencies]
expectrl.workspace = true
