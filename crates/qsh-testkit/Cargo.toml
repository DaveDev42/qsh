[package]
name = "qsh-testkit"
version.workspace = true
edition.workspace = true
# Test harness (build tooling), so publishing has no meaning. Same value as
# the workspace default, spelled out explicitly instead of inherited.
publish = false
license.workspace = true

[dependencies]
qsh-proto.workspace = true
qsh-transport.workspace = true
qsh-core.workspace = true
quinn.workspace = true
tokio.workspace = true
rcgen.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# `raw_quic`: a raw client `quinn::Endpoint` bound to a caller-chosen
# loopback source address, for `crates/qsh-cli/tests/it/adversarial_load.rs`
# scenario 1's spoofed-flood harness (`docs/campaigns/
# m8-adversarial-load.md` §2). `qsh_transport::Dialer::dial` always binds
# `0.0.0.0` with no seam to override it, and admission's `Gate::decide`
# runs before any qsh TLS identity check, so the flood client needs only a
# skip-verification `rustls::ClientConfig` — no client cert, no server
# trust. Same workspace-pinned version `qsh-transport` itself builds
# against.
rustls.workspace = true
zeroize.workspace = true

# `src/bin/qsh-fake-ssh.rs` (the stand-in `ssh` of the SSH bootstrap tests,
# ADR-0044) resets SIGINT and SIGTERM to their default dispositions at
# startup, because a test runner may have started it with SIGINT ignored.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `src/bin/qsh-console-probe.rs` drives the Win32 console API directly
# (GetConsoleMode/SetConsoleMode/ReadFile on the console handles and
# GetConsoleScreenBufferInfo), the same surface the Windows client's console
# layer uses. Windows-only: on other platforms the probe builds as a stub.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

# `tests/it/conpty.rs` opens a ConPTY with portable-pty (the crate the POSIX
# PTY backend already uses) and runs the console probe inside it. A dev
# dependency on Windows only, so no other build pulls its Windows tree.
[target.'cfg(windows)'.dev-dependencies]
portable-pty.workspace = true

[[bin]]
name = "qsh-console-probe"
path = "src/bin/qsh-console-probe.rs"
# The probe includes the console mode arithmetic from qsh-cli by path; that
# file's own unit tests run in qsh-cli, not again here.
test = false

[dev-dependencies]
qsh-proto.workspace = true
# `tests/it/file_host.rs` hashes the bytes it sends and receives over `FILE_DATA`
# the way the host does (ADR-0029 decision 10).
blake3.workspace = true
# `tests/it/resume_secrecy.rs` captures every tracing event the host and the
# client emit during a resume and asserts the credential is in none of them.
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
# `tests/it/reverse_lost_cause_and_since_registered_ms.rs`: parses a real
# `ReconnectEvent`/`RegistrationEvent` `at` field as RFC3339 (issue #4 item
# 6) — the workspace-pinned version, same as `qsh-core`'s own `now_rfc3339`.
time.workspace = true
# `tests/it/trust_withdrawal.rs` pauses the clock after the connection is up to
# pin the one-poll-tick bound (ADR-0031 결정 3); test-only, same pinned version.
tokio = { workspace = true, features = ["test-util"] }
