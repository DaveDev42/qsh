[package]
name = "qsh-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone cargo-fuzz crate, deliberately OUTSIDE the workspace root's
# `[workspace]` (see fuzz/README.md). cargo-fuzz requires nightly; the rest
# of the qsh workspace is stable-pinned (rust-toolchain.toml). An empty
# `[workspace]` table here stops cargo from trying to fold this crate into
# the parent workspace when invoked from inside this directory.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

qsh-proto = { path = "../crates/qsh-proto" }
qsh-transport = { path = "../crates/qsh-transport" }
serde_json = "1"

[profile.release]
debug = 1

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_control"
path = "fuzz_targets/decode_control.rs"
test = false
doc = false
bench = false

