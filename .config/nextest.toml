# `cargo nextest run` configuration. Local defaults otherwise — this only
# adds a bound so a genuine deadlock terminates instead of hanging CI up to
# the job-level timeout (`docs/ROADMAP.md` 2026-08-21 audit A13).
[profile.default]
# A test that runs past 60s is flagged as slow (a warning, not a failure);
# one still running after 3 such periods (180s) is a deadlock, not a slow
# test, and gets terminated. 60s is generous on purpose — several suites
# (mobility, chaos, e2e) legitimately take tens of seconds; the point is a
# bound, not a tight one.
slow-timeout = { period = "60s", terminate-after = 3 }

# nextest's built-in default (0.9.143) is 200ms, confirmed against upstream
# `nextest-runner/default-config.toml` because `cargo nextest run --help`
# does not surface it. We pin it explicitly rather than inherit silently,
# because an unconfirmed default is a reproducibility gap on its own.
# 4a's in-process `LoopbackHarness` spawns no child processes,
# so nextest's leaky path — a child still holding the test process's
# stdout/stderr fd after exit — never applies to that harness; the value
# is pinned for explicitness there, not because a leak was observed or
# ruled out. `qsh-cli`'s own integration suite (21+ files, plus 4c's
# `adversarial_load.rs`) is different: it spawns a real `qsh serve` child
# per test with piped stdout/stderr, so the leaky path is reachable in
# principle there — what actually keeps it closed is `ServeGuard`'s
# `Drop` (`crates/qsh-cli/tests/common/mod.rs`), which kills the child,
# waits for it, and joins its reader threads before returning, so the fd
# is reclaimed even on an assertion panic.
leak-timeout = "200ms"

# `load.yml`'s T2 profile. Three
# departures from `[profile.default]`, all load-only:
# - `test-threads = 1`: `adversarial_load.rs`'s scenarios each assert
#   absolute RSS/fd/echo-p95 numbers against one shared `qsh serve`
#   subprocess's real resource usage — running them in parallel on a
#   2-4 vCPU GHA runner lets one scenario's flood contend for the same
#   CPU/fd budget another scenario is asserting against, which is exactly
#   the kind of oracle-independent flakiness a tight absolute bound cannot
#   tell apart from a real regression.
# - `success-output = "final"`: nextest's own default is `"never"` — a
#   green run would otherwise print none of the scenarios'
#   `eprintln!`-ed diagnostic blocks (baseline/peak/idle RSS, fd, echo
#   p95), which is exactly the record `docs/campaigns/
#   m8-adversarial-load.md`'s round table and Step 5's re-tuning both
#   depend on `load.yml`'s log for.
# - `slow-timeout`'s `period` is raised to 240s (from the default profile's
#   60s, and from an earlier 120s):
#   scenario 12a alone holds a rejection flood for >=12s (12b's own flood
#   ~8s) before its graceful-shutdown teardown, and scenario 13's
#   512-socket accept sweep has its own multi-second drain; 60s reads
#   several of T2's scenarios as "slow" under ordinary host load, not only
#   under a real hang. 120s was itself too tight once M8 Step 5 added the
#   short-mode soak scenario (`crates/qsh-cli/tests/soak.rs`) to this same
#   profile in `load.yml`: that scenario's fixed sleeps alone (120s steady
#   + a 90s drain wait) sum to 210s, measured at 216.8s/217.4s wall-clock
#   on a loaded WSL host — inside 120s x terminate-after(3) = 360s, but
#   only by a ~1.66x margin once dial retries are added on top. 240s x 3 =
#   720s gives that same fixed-sleep floor a >=3x margin instead.
# `terminate-after` stays 3, same deadlock-not-hang reasoning as
# `[profile.default]`.
[profile.load]
test-threads = 1
success-output = "final"
slow-timeout = { period = "240s", terminate-after = 3 }

# The 24h/100-session soak run (`docs/campaigns/m8-soak.md` §4).
# Never used in CI — `scripts/soak/run.sh` invokes it on a dedicated Linux
# host after the fuzz campaign frees the machine. Two departures from
# `[profile.load]`:
# - `slow-timeout`'s `period` is raised to one hour and `terminate-after`
#   is omitted entirely. Confirmed by an in-repo throwaway experiment
#   (measured in-repo: a 1s-period profile against a 4s-sleeping test
#   printed four SLOW warnings and still passed) that nextest's
#   `terminate-after` is opt-in — omitting it means a slow-timeout period
#   elapsing produces a warning line, never a kill, so a 24h test is safe
#   to run under a hard-hour period without a false "deadlock" kill at
#   1/24th of its intended runtime. `[profile.default]`'s and
#   `[profile.load]`'s own `terminate-after = 3` exists specifically to
#   catch a genuine deadlock; the soak scenario's own env-driven duration
#   (`QSH_SOAK_DURATION_SECS`) is the only bound this profile needs, since
#   the scenario itself is expected to run for up to 24h on purpose.
# - `test-threads = 1`, same reasoning as `[profile.load]`: the soak
#   scenario asserts absolute RSS/fd numbers against one shared `qsh serve`
#   subprocess, which a concurrently-running unrelated test would contend
#   with.
[profile.soak]
test-threads = 1
success-output = "final"
fail-fast = false
slow-timeout = { period = "3600s" }

# `long.yml`'s 30-minute blackout round
# (`a_real_30_minute_blackout_is_resumed_within_the_ttl`,
# `crates/qsh-cli/tests/reverse_blackout.rs`), the release-gate evidence for
# `docs/PRD.md` §13's "30분 단절 후에도 TTL 내 세션 복구" row. Two departures
# from `[profile.default]`:
# - `slow-timeout`'s `period` is an hour and `terminate-after` is omitted —
#   the same shape, and the same confirmed reasoning, as `[profile.soak]`
#   above: a test that is *meant* to spend 1800s of wall clock must not be
#   killed by the deadlock guard at 180s (60s x 3). The env gate
#   (`QSH_ACCEPTANCE_LONG`) is what keeps this test skipped under every
#   other profile, so no other profile needs the exemption.
# - `test-threads = 1`: `long.yml` runs the 60s round as its own control in
#   a separate step ahead of this one (its own header comment says why a
#   single invocation covering both tests would not run them in that
#   order), so at most one of the two ever executes under this profile at
#   once from that workflow — but a developer invoking `--profile long`
#   directly on the whole file still benefits from the same guarantee this
#   setting gives `[profile.load]`: the 60s round asserts a wall-clock
#   budget with 5s of slack (`SCHEDULING_SLACK`), and letting it burn the
#   same runner in parallel with anything else is exactly the
#   oracle-independent flakiness `test-threads = 1` exists to avoid.
# `success-output = "final"` for the same reason `[profile.load]` sets it:
# the round's own `eprintln!`-ed summary is the record the run id cites.
[profile.long]
test-threads = 1
success-output = "final"
slow-timeout = { period = "3600s" }
