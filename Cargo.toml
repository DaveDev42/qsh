[workspace]
resolver = "3"
members = [
    "crates/qsh-proto",
    "crates/qsh-transport",
    "crates/qsh-core",
    "crates/qsh-testkit",
    "crates/qsh-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"
bytes = "1"
toml = "0.8"
anyhow = "1"

qsh-proto = { path = "crates/qsh-proto" }
qsh-transport = { path = "crates/qsh-transport" }
qsh-core = { path = "crates/qsh-core" }
qsh-testkit = { path = "crates/qsh-testkit" }
