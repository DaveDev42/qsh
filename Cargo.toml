[workspace]
resolver = "3"
members = [
    "crates/qsh-proto",
    "crates/qsh-transport",
    "crates/qsh-core",
    "crates/qsh-testkit",
    "crates/qsh-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.4.2"
# New crates are born closed: only the four we publish set `publish = true`
# per crate. (ADR-0006 outcome, docs/PRD.md §16)
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/DaveDev42/qsh"
# Workspace-root-relative path. cargo copies this into each crate's tarball
# root when packaging and rewrites the published manifest to
# `readme = "README.md"`.
readme = "README.md"

[workspace.dependencies]
# frontend / contract
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1"
thiserror = "2"
ulid = "3"
bytes = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.23"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# wire
prost = "0.14"
prost-build = "0.14"
protox = "0.9"

# transport (docs/design/protocol.md §2, architecture.md §8)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "logging", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
x509-parser = "0.18"
# The HMAC key type `quinn::EndpointConfig::new` takes
# (`qsh_transport::Listener::bind_with_reset_key`); already in the tree
# through rustls/quinn, same lockfile entry.
aws-lc-rs = "1"
# `HashedConnectionIdGenerator::from_key`: quinn drops a short-header packet
# whose connection ID its generator cannot validate, before any stateless
# reset is considered, so the generator's key must survive a restart too
# (`qsh_transport::Listener::bind_with_reset_key`). The exact crate `quinn`
# already resolves to, same lockfile entry.
quinn-proto = { version = "0.11", default-features = false }
# UDP socket buffer tuning (`qsh_transport::endpoint::bind_udp_socket`,
# used internally by both `Listener::bind` and `Dialer::dial`;
# `docs/design/testing.md` CI 규율's GHA-macOS-small-`SO_RCVBUF` note) —
# quinn's own `Endpoint::client`/`::server` convenience constructors bind
# their own socket with no override seam, so `bind_udp_socket` builds the
# `std::net::UdpSocket` itself (setting `SO_RCVBUF`/`SO_SNDBUF`) and hands
# it to `quinn::Endpoint::new` instead. Version pinned to what
# `quinn`/`quinn-udp`/`tokio` already resolve to (`Cargo.lock`), so this
# adds no second `socket2` to the dependency tree.
socket2 = "0.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "net", "signal", "io-std"] }

# identity / crypto hygiene
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
sha2 = "0.11"
# Resume token custody (`docs/design/architecture.md` §8, protocol.md §10):
# blake3 hashes the token the host stores, subtle compares it in constant
# time, zeroize keeps the plaintext out of freed memory.
blake3 = { version = "1", default-features = false, features = ["std"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.9"
libc = "0.2"

# POSIX PTY backend (`docs/design/architecture.md` §4/§8; unix-only, declared
# under `[target.'cfg(unix)'.dependencies]` in qsh-core)
portable-pty = "0.9"

# Client-side raw-mode terminal for the interactive TUI
# (`docs/design/architecture.md` §8; unix-only, declared under
# `[target.'cfg(unix)'.dependencies]` in qsh-cli). Direct termios +
# TIOCGWINSZ; crossterm is deliberately not used.
nix = { version = "0.31", default-features = false }

# diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# tests
proptest = "1"
tempfile = "3"
jsonschema = { version = "0.58", default-features = false }
# expect harness: runs the client itself under a pty (`docs/design/testing.md`
# L5). unix-only, declared under `[target.'cfg(unix)'.dev-dependencies]`.
expectrl = "0.9"

qsh-proto = { path = "crates/qsh-proto", version = "0.4.2" }
qsh-transport = { path = "crates/qsh-transport", version = "0.4.2" }
qsh-core = { path = "crates/qsh-core", version = "0.4.2" }
# Not published, so no version. cargo drops a versionless path dev-dependency
# entirely from the published manifest (measured: the published qsh-cli
# manifest has no qsh-testkit entry), so this line does not block qsh-cli.
#
# Publishing note: the four public crates set `exclude = ["/tests/"]`. Because
# the line above is dropped from the published manifest, most integration tests
# could not compile from an extracted tarball, and qsh-cli's fixtures and
# `ssh_golden` would only add size. Inline `#[cfg(test)]` modules and sibling
# `tests.rs` files live under `src/`, so they still ship. The leading slash
# matters: an unanchored `tests/` would also drop the `src/**/tests/` module
# directories and break the build.
qsh-testkit = { path = "crates/qsh-testkit" }
