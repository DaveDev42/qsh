# cargo-deny configuration (v2 schema). See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# zbus 6 folded these crates into itself, so the standalone 5.x crates are
# marked unmaintained. Nothing is vulnerable: they reach qsh only through
# secret-service 5.2 (the Linux keyring store), which has no zbus 6 release
# yet. Drop these once zbus-secret-service-keyring-store moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained standalone crate, merged into zbus 6; pulled by secret-service 5.2" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained standalone crate, merged into zbus 6; pulled by secret-service 5.2" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained standalone crate, merged into zbus 6; pulled by secret-service 5.2" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: archived 2026-10-01, unmaintained; dev-only, pulled by expectrl 0.9 -> nix 0.26 for PTY acceptance tests" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, a compile-time macro crate with no runtime code; pulled by iroh 1.4 -> netwatch -> netdev -> netlink-packet-core (ADR-0061). Drop once iroh's netlink stack moves off it." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots and webpki-root-certs (Mozilla's CA bundle as data), pulled
    # by iroh's relay TLS (ADR-0061 decision 12).
    "CDLA-Permissive-2.0",
    # async_io_stream, pharos and ws_stream_wasm: iroh-relay's browser (wasm)
    # transport. Public-domain style; not linked into native builds, but
    # `cargo deny` walks every target.
    "Unlicense",
]
confidence-threshold = 0.8
# attohttpc (MPL-2.0) is igd-next's blocking HTTP client, pulled in by iroh's
# portmapper (ADR-0064). MPL-2.0 is a file-level copyleft: using the crate
# unmodified from crates.io, as here, obliges nothing beyond keeping its
# source available, which crates.io does. The exception is per crate, so a
# new MPL-2.0 dependency still fails the license check.
exceptions = [
    { allow = ["MPL-2.0"], crate = "attohttpc" },
]

[bans]
multiple-versions = "warn"
# The four published crates (qsh-proto, qsh-transport, qsh-core, qsh-cli)
# gained a version on their path dependencies when M10 opened publishing
# (crates.io requires it). Two versionless path dependencies remain, both
# intentional: qsh-cli's dev-dependency on qsh-testkit, and xtask's on
# qsh-cli. Both are publish = false, so adding a version would require a
# crate that is never published. This key only matters when [bans] wildcards
# is deny, which it is not right now.
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
