name: CI

# Every push to main and every pull request runs the gate set `CLAUDE.md`
# requires before a commit: fmt, clippy -D warnings, tests, arch-lint,
# cargo-deny — plus the interactive acceptance set, which needs binaries
# installed to be more than a row of skips (see the `acceptance` job).
#
# The matrix is trimmed to the legs that carry unique signal (2026-08-27,
# runner-time diet — the repo is public so none of this is billed, but
# ~8 redundant job-minutes per push bought nothing):
# - `test` runs on Linux x64/arm64, macOS arm64, Windows x64. The
#   macOS *Intel* leg is gone: it never caught a failure the other legs
#   missed, x86_64-unix semantics are the Linux leg's job, macOS API
#   coverage is macos-14's, and release.yml still builds + smoke-runs
#   x86_64-apple-darwin on every tag.
# - `clippy` runs on Linux + Windows only. Lints are overwhelmingly
#   platform-independent; the Windows leg is kept because it has real
#   unique surface (`cfg(not(unix))` dead_code — precedents 8897b2f,
#   7890a5d). macOS-cfg code still compiles under `-D warnings` in the
#   macOS `test` leg (setup-rust-toolchain sets RUSTFLAGS), so plain
#   rustc warnings there still fail CI; only macOS-unique *clippy* lints
#   are forgone, and none has ever fired.
# - Doc tests and arch-lint run once, on Linux: both are
#   platform-independent by construction (doc examples have no cfg
#   branches today; arch-lint reads Cargo.toml dependency direction,
#   which cannot differ by OS — xtask itself still builds everywhere via
#   clippy/test `--all-targets`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # `VersionData.build.commit` (`docs/CLI.md` §6.10, `PLAN.md` M7 Step 1):
  # compiled in via `option_env!`, so every job that builds or tests the
  # workspace needs it in `env`, not just the ones that ship a binary —
  # `test`'s own build is what `fixtures.rs`'s `version.json` golden
  # fixture runs against. `qsh_testkit::fixtures::normalize` drops the
  # `build` key before comparing (`PLAN.md` M7 Step 1 (a)-추기 ②), so this
  # is safe to set workflow-wide rather than threaded per job.
  QSH_BUILD_COMMIT: ${{ github.sha }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Honors rust-toolchain.toml (pinned channel + components).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest: one process per test — required for the PTY/process tests.
      - run: cargo nextest run --workspace --no-fail-fast
      # Doc tests are not run by nextest. Platform-independent, so once
      # on Linux is enough (header comment).
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo test --workspace --doc
      # Runs on all four runners, unlike the doc-test step above: an
      # intra-doc link on a `#[cfg(...)]`-gated item must not resolve only
      # on the platform that happens to compile that item in, so "zero
      # warnings" needs every target this matrix builds for, not just one.
      # Reproduce a Windows-only break from macOS or Linux with:
      #   RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --target x86_64-pc-windows-gnu
      - name: Doc (no warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The interactive acceptance set (`PLAN.md` M2 DoD 2) as a *standing*
  # gate. The suite skips an acceptance item whose binary is missing, which
  # is right for a developer's box and wrong for a job that is supposed to
  # keep the item from rotting — so this one installs what it needs and
  # names those binaries in QSH_ACCEPTANCE_STRICT, which turns a missing
  # install into a failure instead of a skip.
  #
  # `claude` is deliberately not in the list: it is not installable on a
  # hosted runner. The full five-binary set (`QSH_ACCEPTANCE_STRICT=1`) is
  # what certifies the milestone, and PLAN.md records where that was run.
  acceptance:
    name: acceptance (interactive shells)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install the acceptance set this runner can provide
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux vim zsh curl
      - run: cargo nextest run -p qsh-cli --test tui_expect
        env:
          QSH_ACCEPTANCE_STRICT: bash,zsh,vim,tmux
      # ADR-0019 / docs/CLI.md §6.9: a real `curl --socks5-hostname`
      # driven through the real `-D` SOCKS5 listener — the positive path
      # (pinned by an IPv4 literal), the host-local filter, an ACL deny, and
      # a port re-bind after the holder exits. The by-hostname twin of the
      # positive path only runs when this runner's own hostname happens to
      # resolve to its LAN address (best-effort; it prints a skip line
      # otherwise, same as a missing binary would). `curl` ships on
      # ubuntu-24.04 already; it is still named in the apt-get line above so
      # the promise is explicit, and `QSH_ACCEPTANCE_STRICT` below turns a
      # missing install into a failure instead of a skip, same discipline as
      # `tui_expect` above.
      - run: cargo nextest run -p qsh-cli --test socks_curl
        env:
          QSH_ACCEPTANCE_STRICT: curl
      # The literal 60-second reverse-route blackout (`PLAN.md` M3 Step 8
      # (b)/(d), `docs/ROADMAP.md` M3 DoD 2). `QSH_ACCEPTANCE_SLOW` is what
      # keeps this out of the PR-gated unit suite (`docs/design/testing.md`'s
      # "no sleep()" discipline names this test as the one deliberate
      # exception) while still making it an always-on gate here, the same
      # way `QSH_ACCEPTANCE_STRICT` does above for the interactive shell set.
      - run: cargo nextest run -p qsh-cli --test reverse_blackout
        env:
          QSH_ACCEPTANCE_SLOW: 1
      # M4 Step 7 DoD 3/4 (`PLAN.md` M4 Step 7 (d), `docs/design/testing.md`
      # L10): the same standing-gate shape as the two steps above, applied
      # to the tunnel perf DoDs instead of an interactive/timing one.
      # `QSH_ACCEPTANCE_STRICT` is what asserts the literal DoD 3 ratio
      # (≥0.80, not the lenient 0.5 smoke tier) and turns DoD 4's gate on
      # (it has no strict/smoke split — see that test's own module doc).
      # Both harnesses are platform-neutral (no `cfg(unix)` in their call
      # path — `LocalForwardHandle::start`'s plain forward route and the
      # pipe-backed `PipeFactory` session stand-in both already run on
      # Windows in the ordinary `test` job's matrix), so this asserts the
      # thresholds, not just a compile check — the Windows leg's own
      # coverage is the `test`/`clippy`/`arch` matrix jobs' unconditional
      # `cargo nextest run --workspace`/`clippy --all-targets`, which build
      # and skip-run these same two binaries there.
      - run: cargo nextest run -p qsh-testkit --test tunnel_throughput
        env:
          QSH_ACCEPTANCE_STRICT: 1
      - run: cargo nextest run -p qsh-testkit --test tunnel_echo_under_load
        env:
          QSH_ACCEPTANCE_STRICT: 1

  arch:
    name: arch-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p xtask -- arch

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Not cargo-deny-action: its docker image floats independently of the
      # action tag and broke against rust-toolchain.toml's pin (rustup inside
      # the container had no matching musl toolchain). Same toolchain setup
      # as every other job here + a prebuilt cargo-deny binary instead.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # crates.io publish gate (ADR-0006, docs/PRD.md §16). The four published
  # crates are packaged and their tarballs compiled, but nothing is uploaded:
  # `--dry-run` stops before the request, so this needs no registry token.
  #
  # One invocation, not four. A per-crate `cargo publish --dry-run -p
  # qsh-transport` fails with "no matching package named `qsh-proto` found /
  # location searched: crates.io index" until qsh-proto is actually on the
  # registry — the generated manifest drops the `path` and keeps only the
  # version. `--workspace` packages all four together, resolves the
  # intra-workspace deps against that set, and verifies them in dependency
  # order. It also skips `qsh-testkit` and `xtask` on its own, because both
  # are `publish = false`.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The dry-run itself does NOT pin which crates may publish: opening
      # `qsh-testkit` would just add it to the batch and still pass, because
      # the batch resolves its `qsh-core` dep against its own temporary
      # registry. This step is what pins the set. `cargo metadata` reports
      # `publish: []` for `publish = false` and `null` for open.
      - name: The publish set is exactly the four contract crates
        run: |
          set -euo pipefail
          actual=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort | tr '\n' ' ')
          expected='qsh-cli qsh-core qsh-proto qsh-transport '
          test "$actual" = "$expected" \
            || { echo "publish set drifted: [$actual]"; exit 1; }
      - run: cargo publish --dry-run --workspace

  # Single required check for branch protection: green iff every job above is.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, acceptance, arch, deny, publish-dry-run]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "some job did not succeed:"; echo '${{ toJSON(needs) }}' | jq .; exit 1; }
