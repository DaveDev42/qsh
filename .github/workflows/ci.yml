name: CI

# Every push to main and every pull request runs the full gate set on all
# three desktop platforms (Linux x64/arm64, macOS arm64/x64, Windows x64).
# The gates are exactly the ones `CLAUDE.md` requires before a commit:
# fmt, clippy -D warnings, tests, arch-lint, cargo-deny — plus the
# interactive acceptance set, which needs binaries installed to be more
# than a row of skips (see the `acceptance` job).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Honors rust-toolchain.toml (pinned channel + components).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest: one process per test — required for the PTY/process tests.
      - run: cargo nextest run --workspace --no-fail-fast
      # Doc tests are not run by nextest.
      - run: cargo test --workspace --doc

  # The interactive acceptance set (`PLAN.md` M2 DoD 2) as a *standing*
  # gate. The suite skips an acceptance item whose binary is missing, which
  # is right for a developer's box and wrong for a job that is supposed to
  # keep the item from rotting — so this one installs what it needs and
  # names those binaries in QSH_ACCEPTANCE_STRICT, which turns a missing
  # install into a failure instead of a skip.
  #
  # `claude` is deliberately not in the list: it is not installable on a
  # hosted runner. The full five-binary set (`QSH_ACCEPTANCE_STRICT=1`) is
  # what certifies the milestone, and PLAN.md records where that was run.
  acceptance:
    name: acceptance (interactive shells)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install the acceptance set this runner can provide
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux vim zsh
      - run: cargo nextest run -p qsh-cli --test tui_expect
        env:
          QSH_ACCEPTANCE_STRICT: bash,zsh,vim,tmux
      # The literal 60-second reverse-route blackout (`PLAN.md` M3 Step 8
      # (b)/(d), `docs/ROADMAP.md` M3 DoD 2). `QSH_ACCEPTANCE_SLOW` is what
      # keeps this out of the PR-gated unit suite (`docs/design/testing.md`'s
      # "no sleep()" discipline names this test as the one deliberate
      # exception) while still making it an always-on gate here, the same
      # way `QSH_ACCEPTANCE_STRICT` does above for the interactive shell set.
      - run: cargo nextest run -p qsh-cli --test reverse_blackout
        env:
          QSH_ACCEPTANCE_SLOW: 1
      # M4 Step 7 DoD 3/4 (`PLAN.md` M4 Step 7 (d), `docs/design/testing.md`
      # L10): the same standing-gate shape as the two steps above, applied
      # to the tunnel perf DoDs instead of an interactive/timing one.
      # `QSH_ACCEPTANCE_STRICT` is what asserts the literal DoD 3 ratio
      # (≥0.80, not the lenient 0.5 smoke tier) and turns DoD 4's gate on
      # (it has no strict/smoke split — see that test's own module doc).
      # Both harnesses are platform-neutral (no `cfg(unix)` in their call
      # path — `LocalForwardHandle::start`'s plain forward route and the
      # pipe-backed `PipeFactory` session stand-in both already run on
      # Windows in the ordinary `test` job's matrix), so this asserts the
      # thresholds, not just a compile check — the Windows leg's own
      # coverage is the `test`/`clippy`/`arch` matrix jobs' unconditional
      # `cargo nextest run --workspace`/`clippy --all-targets`, which build
      # and skip-run these same two binaries there.
      - run: cargo nextest run -p qsh-testkit --test tunnel_throughput
        env:
          QSH_ACCEPTANCE_STRICT: 1
      - run: cargo nextest run -p qsh-testkit --test tunnel_echo_under_load
        env:
          QSH_ACCEPTANCE_STRICT: 1

  arch:
    name: arch-lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p xtask -- arch

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Not cargo-deny-action: its docker image floats independently of the
      # action tag and broke against rust-toolchain.toml's pin (rustup inside
      # the container had no matching musl toolchain). Same toolchain setup
      # as every other job here + a prebuilt cargo-deny binary instead.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Single required check for branch protection: green iff every job above is.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, acceptance, arch, deny]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "some job did not succeed:"; echo '${{ toJSON(needs) }}' | jq .; exit 1; }
