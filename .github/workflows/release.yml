name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least privilege by default; the release job opts up to contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `VersionData.build.commit` (`docs/CLI.md` §6.10): release binaries are
  # exactly the ones whose provenance the field exists to answer, so the
  # release build compiles it in the same way ci.yml does.
  QSH_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Static Linux build for old-glibc distributions
          # (`docs/ROADMAP.md` M10 acceptance criteria, third sentence).
          # Native x86_64 runner, not a cross build: crossing would put
          # aws-lc-sys back on a toolchain hunt it does not need here.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # ── macOS codesign + notarization (docs/ROADMAP.md M10 범위, DoD 2) ──
      # Gated exactly the way the `homebrew-tap` job below gates on its
      # deploy key: a presence check writes a `has-*` output and every
      # later step reads it, so a repository with no Apple credentials
      # stays green and ships what it ships today. `release.yml` has no
      # `pull_request` trigger, so a fork PR never reaches this branch.
      #
      # Placed before the toolchain setup on the same reasoning the nextest
      # install below states: a misconfiguration should fail in seconds,
      # not after a ten-minute release compile.
      #
      # All six or none. A partial set is a misconfiguration, and the two
      # refs deserve different answers: on a tag the artifacts ship and
      # DoD 2 is being judged, so it is an error; on a branch dispatch the
      # artifacts are thrown away and the operator is mid-way through
      # adding secrets, so it is a warning and a skip.
      - name: Check for Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_P8: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
          HAS_P12: ${{ secrets.APPLE_CERT_P12 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          present=0
          for flag in "$HAS_KEY_ID" "$HAS_ISSUER" "$HAS_P8" \
                      "$HAS_P12" "$HAS_P12_PASSWORD" "$HAS_TEAM_ID"; do
            if [ "$flag" = "true" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 6 ]; then
            echo "has-apple=true" >> "$GITHUB_OUTPUT"
            echo "All six Apple signing secrets are set; signing and notarizing."
            exit 0
          fi
          echo "has-apple=false" >> "$GITHUB_OUTPUT"
          if [ "$present" -eq 0 ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::warning title=Unsigned release::No Apple signing secrets are configured; this tag ships an ad-hoc signed macOS binary that Gatekeeper rejects on a quarantined download."
            else
              echo "No Apple signing secrets are configured; skipping codesign and notarization."
            fi
            exit 0
          fi
          msg="Apple signing is partially configured: ${present} of 6 secrets are set."
          if [ "$IS_TAG" = "true" ]; then
            echo "::error title=Partial Apple signing config::${msg} Set all six or none."
            exit 1
          fi
          echo "::warning title=Partial Apple signing config::${msg} Skipping codesign and notarization."
      # Honors rust-toolchain.toml (pinned channel).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      # The functional smoke below is a nextest run, same entry point as
      # every other test in this repo (`CLAUDE.md`'s command set, and
      # `docs/design/testing.md`'s "cargo-nextest 필수" rule). Installed
      # before the build so a broken install fails in seconds instead of
      # after a ten-minute release compile.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # musl-gcc only. aws-lc-sys 0.45.0 ships pregenerated bindings for this
      # triple, so its build script takes the cc path and never reaches the
      # cmake builder; nothing here needs cmake, clang or bindgen. If that
      # ever changes the build fails loudly with the builder it chose in the
      # log, which is more useful than pre-installing cmake and never knowing.
      - name: Install the musl C toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p qsh-cli --target ${{ matrix.target }}

      # Secrets reach the shell through `env:` only, never interpolated
      # into `run:`; nothing echoes them and no step runs with `-x`.
      #
      # A new keychain defaults to `lock-on-sleep timeout=300s` (measured
      # with `security show-keychain-info`), which would relock it before
      # `codesign` runs; `set-keychain-settings` with no flags is
      # `no-timeout`, which is why the keychain is created here, after the
      # build, rather than at the top of the job.
      - name: Import the Developer ID certificate
        id: identity
        if: runner.os == 'macOS' && steps.apple.outputs.has-apple == 'true'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/qsh-signing.keychain-db"
          p12="${RUNNER_TEMP}/qsh-signing.p12"
          password="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
          # Armed before the p12 is ever written, so a failure anywhere
          # below (bad password, corrupt cert) still deletes it -- `rm -f`
          # after `security import` would not run on that path.
          trap 'rm -f "$p12"' EXIT

          security create-keychain -p "$password" "$keychain"
          # Written as soon as the keychain exists, not at the end of the
          # step: `Delete the signing keychain` is gated on this output,
          # so a later failure in this step must not leave it unset.
          echo "keychain=${keychain}" >> "$GITHUB_OUTPUT"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          umask 077
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$p12"
          # `-P` is the only way to hand `security import` a passphrase;
          # there is no stdin form, so it is visible in `ps` for the life
          # of the call on a single-tenant ephemeral runner.
          security import "$p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign

          # Without a partition list, codesign's first use of the imported
          # private key raises a UI prompt nobody can answer. `-A` (allow
          # any application) is the insecure shortcut and is not used.
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null

          # `list-keychains -s` REPLACES the search list, so the current
          # list is read back and the temp keychain appended to it. The
          # array is not an unquoted `$(...)`: shellcheck rejects that
          # (SC2046) and actionlint runs shellcheck over every `run:`.
          prior=()
          while IFS= read -r kc; do
            if [ -n "$kc" ]; then prior+=("$kc"); fi
          done <<EOF
          $(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          EOF
          if [ "${#prior[@]}" -gt 0 ]; then
            security list-keychains -d user -s "${prior[@]}" "$keychain"
          else
            security list-keychains -d user -s "$keychain"
          fi

          # The identity is read out of the keychain that was just
          # imported rather than assembled from a secret. `codesign
          # --sign` accepts the certificate's SHA-1 hash (`man codesign`:
          # "interpreted as the SHA-1 hash of the certificate part of the
          # desired identity"), which cannot collide the way a common-name
          # substring can -- and the common name carries an organization
          # name that is not one of the six secrets.
          #
          # `security find-identity` exits 0 on "0 valid identities found"
          # (measured), so the count is what is checked, not the status.
          security find-identity -v -p codesigning "$keychain" \
            > "${RUNNER_TEMP}/identities.txt"
          sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*\([0-9A-F]\{40\}\)[[:space:]]*"Developer ID Application:.*"$/\1/p' \
            "${RUNNER_TEMP}/identities.txt" > "${RUNNER_TEMP}/hashes.txt"
          found="$(wc -l < "${RUNNER_TEMP}/hashes.txt" | tr -d ' ')"
          if [ "$found" -ne 1 ]; then
            echo "::error title=Signing identity::expected exactly one Developer ID Application identity in the imported keychain, found ${found}"
            exit 1
          fi
          hash="$(cat "${RUNNER_TEMP}/hashes.txt")"

          # APPLE_TEAM_ID earns its keep as a cross-check: a Developer ID
          # common name ends with the team id in parentheses.
          cn="$(sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*[0-9A-F]\{40\}[[:space:]]*"\(Developer ID Application:.*\)"$/\1/p' \
            "${RUNNER_TEMP}/identities.txt")"
          case "$cn" in
            *"(${APPLE_TEAM_ID})") ;;
            *)
              echo "::error title=Signing identity::the imported identity's common name does not end with the configured APPLE_TEAM_ID"
              exit 1
              ;;
          esac
          rm -f "${RUNNER_TEMP}/identities.txt" "${RUNNER_TEMP}/hashes.txt"

          # A certificate hash is public -- it is derived from the cert
          # that ships inside every signed binary -- so logging it is safe
          # and makes a wrong-certificate run diagnosable.
          echo "Signing with certificate ${hash}"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      # `--options runtime` is a notarization prerequisite; `--timestamp`
      # is what keeps the signature valid past the certificate's expiry.
      # No entitlements: `otool -L` on a release build lists only
      # Security.framework, CoreFoundation, libiconv and libSystem, all
      # Apple-signed, so hardened runtime's library validation is already
      # satisfied, and qsh needs no JIT, no DYLD overrides, no unsigned
      # executable memory and no debugger attachment.
      #
      # This signs in place, before `Binary starts` and `Release smoke
      # (functional)` below, so the smoke certifies the bytes that ship
      # and `Package archive (unix)` needs no change and no repackage.
      - name: Sign the binary
        if: runner.os == 'macOS' && steps.apple.outputs.has-apple == 'true'
        shell: bash
        env:
          IDENTITY: ${{ steps.identity.outputs.hash }}
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" \
            "target/${TARGET}/release/qsh"

      # `codesign --verify` on its own proves nothing here: it exits 0 on
      # the ad-hoc linker-signed binary this leg produces today
      # (measured). The `-R` requirement is the assertion; the two display
      # runs are what put DoD 2's evidence in the job log. `codesign -d`
      # writes to stderr and nothing to stdout (measured), hence `2>&1`.
      - name: Verify the signature
        if: runner.os == 'macOS' && steps.apple.outputs.has-apple == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/qsh"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv --verbose=4 "$bin" 2>&1
          codesign --verify --strict \
            -R="anchor apple generic and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"" \
            "$bin"
          if ! codesign -dv --verbose=4 "$bin" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "::error title=Hardened runtime::the signature does not carry the runtime flag"
            exit 1
          fi

      # crt-static is the target default; the readelf step is the guard.
      # Pins the static-link precondition for the third M10 acceptance
      # sentence (`docs/ROADMAP.md` M10 acceptance criteria); the run on an
      # old-glibc distribution is a separate clean-VM campaign. `ldd` alone
      # is not an assertion: on a static non-PIE it prints "not a dynamic
      # executable" and exits non-zero, on a static PIE it prints
      # "statically linked" and exits 0. DT_NEEDED is the invariant that
      # holds either way.
      - name: Static-link evidence (musl)
        if: matrix.musl
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/qsh"
          file "$bin"
          ldd "$bin" 2>&1 || true
          dyn_out="$(readelf -d "$bin")"
          if printf '%s' "$dyn_out" | grep -q NEEDED; then
            echo "::error::${bin} has DT_NEEDED entries; it is not statically linked"
            exit 1
          fi

      # `version --json` proves only that the binary starts. What ships is
      # judged by the functional smoke in the next step (`docs/ROADMAP.md`
      # M10 acceptance criteria, 2026-08-21 audit revision, which defines
      # "동작" as the functional smoke rather than `version --json`). This
      # line stays because it is free and separates "the binary does not
      # run on this runner" from "a session axis broke".
      - name: Binary starts
        shell: bash
        run: ./target/${{ matrix.target }}/release/qsh${{ matrix.ext }} version --json

      # The release-profile functional smoke
      # (`crates/qsh-cli/tests/release_smoke.rs`, `docs/design/testing.md`
      # L6's M10 paragraph). `QSH_SMOKE_BIN` is an absolute path to the
      # binary this leg just built; the harness rejects a path that is not
      # a file (and, on unix, not executable) instead of failing deep
      # inside a spawn. `QSH_SMOKE_STRICT=1` removes the debug fallback, so
      # a leg whose env wiring broke fails rather than certifying the
      # nextest-built debug binary.
      #
      # Unix legs run init -> mutual trust -> `exec --json` -> pty shell ->
      # `~d` detach -> `qsh attach`; the Windows leg compiles the
      # `#[cfg(not(unix))]` twin, which stops after `exec --json` (no pty
      # client off unix).
      #
      # No `--target`: the harness is a host tool and its dev artifacts
      # land in `target/debug/`, never in the `target/<triple>/release/`
      # tree the packaging steps below read. `--success-output final` is
      # what puts the harness's `release_smoke: driving <path>` line into
      # this log on a green run (nextest captures a passing test's output
      # otherwise).
      - name: Release smoke (functional)
        run: cargo nextest run -p qsh-cli --test release_smoke --success-output final
        env:
          QSH_SMOKE_STRICT: 1
          QSH_SMOKE_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/qsh${{ matrix.ext }}
          RUST_BACKTRACE: short

      # `--wait` is not the gate on its own: `notarytool submit`'s exit
      # code has historically been 0 even for an `Invalid` submission, so
      # the JSON `status` field is what is asserted -- which is also
      # exactly the evidence `docs/ROADMAP.md` M10's DoD 2 asks for.
      # `--output-format json` also suppresses the progress spinner, which
      # otherwise fills the log with carriage returns.
      #
      # No stapler: `xcrun stapler` attaches a ticket to a .app, .dmg or
      # .pkg, and this release ships a bare executable in a tar.gz
      # (`docs/ROADMAP.md` M10 결정 기록 Q2). Notarization therefore does
      # not touch the binary, so the bytes verified above are the bytes
      # `Package archive (unix)` tars below.
      - name: Notarize
        if: runner.os == 'macOS' && steps.apple.outputs.has-apple == 'true'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          p8="${RUNNER_TEMP}/asc.p8"
          archive="${RUNNER_TEMP}/qsh-notarize.zip"
          trap 'rm -f "$p8" "$archive"' EXIT

          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$p8"

          # `-j` junks paths so the archive holds a single `qsh` member.
          # `ditto -c -k` also works but adds an AppleDouble `._qsh`
          # sidecar for the binary's com.apple.provenance xattr (measured).
          rm -f "$archive"
          zip -j -q "$archive" "target/${TARGET}/release/qsh"

          submission="$(xcrun notarytool submit "$archive" \
            --key "$p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m \
            --output-format json)"
          echo "$submission"

          id="$(printf '%s' "$submission" | jq -r '.id')"
          status="$(printf '%s' "$submission" | jq -r '.status')"
          echo "notarytool status=${status} id=${id}"

          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::notarytool reported ${status}; the notary log follows."
            if [ "$id" != "null" ] && [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --key "$p8" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --team-id "$APPLE_TEAM_ID" || true
            else
              echo "no submission id in the response; raw submission JSON is above"
            fi
            exit 1
          fi

      # Archive naming (qsh-<tag>-<target>.tar.gz / .zip) is a contract with
      # scripts/install.sh — keep the two in sync if you change this.
      #
      # Must run after `Sign the binary` / `Verify the signature` /
      # `Notarize` above: nothing in this job re-extracts the archive to
      # confirm the tar holds the signed, notarized bytes, so if this step
      # ever moves earlier the chain above would keep passing while
      # certifying a binary the archive no longer contains.
      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="qsh-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$asset" -C "target/${{ matrix.target }}/release" qsh
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "qsh-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/qsh.exe" -DestinationPath $asset
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$asset"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          # Default is a warning, which would ship a release quietly missing
          # a platform. A packaging step that produced nothing is a failure.
          if-no-files-found: error

      # `security delete-keychain` also drops the entry from the user
      # search list (measured), so no restore is needed -- and a restore
      # written as `list-keychains -s login.keychain-db` would itself drop
      # any other keychain that happened to be on the list.
      - name: Delete the signing keychain
        if: always() && runner.os == 'macOS' && steps.identity.outputs.keychain != ''
        shell: bash
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: |
          # No `-e` here, but the runner's `bash --noprofile --norc -eo
          # pipefail` invocation already has it on for this whole script --
          # `set -uo pipefail` cannot clear it. This step runs under
          # `always()` as the last-chance cleanup, so every command in it
          # must carry `|| true` or a single failure here fails the job.
          set -uo pipefail
          rm -f "${RUNNER_TEMP}/qsh-signing.p12" "${RUNNER_TEMP}/asc.p8"
          security delete-keychain "$KEYCHAIN" || true

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    # Only cut a GitHub Release on an actual tag push; workflow_dispatch
    # runs (e.g. against a branch) build and smoke-test only.
    # `github.ref_name` becomes the artifact name (`build` job's `ASSET`
    # above), and `upload-artifact` rejects a name containing `/` — dispatch
    # from a branch whose name has no slash.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # Build provenance for every published asset (`docs/ROADMAP.md` M10
      # scope, "SLSA provenance"). The action hashes what `download-artifact`
      # put on disk, so whatever the `build` job produced is what gets
      # attested. `dist/*` is the published asset set exactly: the same glob
      # `Create release` below uploads, `SHA256SUMS` included, because that
      # file is something users download and check against. Directories are
      # filtered out by the action; a pattern matching nothing is a step
      # failure, not a silent skip. The attestation lands in this
      # repository's attestation store, not on the release, and is checked
      # with `gh attestation verify <asset> --repo DaveDev42/qsh` (README's
      # Install section, scripts/README.md).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      # Semver: anything after a `-` in the version is a prerelease
      # identifier (v0.1.0-alpha.1, v0.1.0-rc.2). A bare v0.1.0 is not.
      - name: Determine prerelease flag
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          tag="${{ github.ref_name }}"
          # Re-running the workflow on an existing tag replaces the assets
          # rather than failing on "release already exists".
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes \
              "${prerelease_flag[@]}"
          fi

  homebrew-tap:
    name: homebrew-tap
    needs: release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      # HOMEBREW_TAP_DEPLOY_KEY is the private half of a write-enabled deploy
      # key registered on DaveDev42/homebrew-tap (title "qsh release.yml tap
      # bump"). A deploy key is scoped to that one repository and never
      # expires, and unlike a fine-grained PAT it can be created through the
      # API, so no browser session is needed to rotate it. If the secret is
      # missing the job stays green-but-skipped instead of failing every tag
      # push.
      #
      # The key alone is not enough to bump: Formula/qsh.rb must already exist
      # in the tap (the first release pushes it by hand). Until then,
      # continue-on-error keeps a tap-side failure from redding out a release
      # whose binaries and GitHub Release already published successfully.
      - name: Check for tap deploy key
        id: check
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: echo "has-key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        id: tap
        if: steps.check.outputs.has-key == 'true'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: DaveDev42/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      # Same three-line rewrite (version / url / sha256) that
      # DaveDev42/homebrew-tap-release@v1 performs over the Contents API,
      # done over git so the deploy key can push it.
      - name: Bump homebrew-tap formula
        if: steps.check.outputs.has-key == 'true' && steps.tap.outcome == 'success'
        continue-on-error: true
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
          # Same asset naming as the build job's Package archive (unix) step.
          DOWNLOAD_URL: https://github.com/DaveDev42/qsh/releases/download/${{ github.ref_name }}/qsh-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
        run: |
          set -euo pipefail
          version="${TAG#v}"
          formula=Formula/qsh.rb
          if [ ! -f "$formula" ]; then
            echo "$formula is not in the tap yet; the first release pushes it by hand."
            exit 1
          fi
          tarball="$(mktemp)"
          curl -fsSL --retry 3 "$DOWNLOAD_URL" -o "$tarball"
          sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          rm -f "$tarball"
          echo "sha256=${sha256}"
          awk -v ver="$version" -v url="$DOWNLOAD_URL" -v sha="$sha256" '
            /^[[:space:]]*version[[:space:]]+"/ { sub(/"[^"]*"/, "\"" ver "\"") }
            /^[[:space:]]*url[[:space:]]+"/     { sub(/"[^"]*"/, "\"" url "\"") }
            /^[[:space:]]*sha256[[:space:]]+"/  { sub(/"[^"]*"/, "\"" sha "\"") }
            { print }' "$formula" > "$formula.new"
          mv "$formula.new" "$formula"
          if git diff --quiet -- "$formula"; then
            echo "Formula already at ${version}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$formula"
          git commit -m "qsh ${version}"
          git push origin HEAD:main
          echo "Pushed qsh ${version} to DaveDev42/homebrew-tap."
