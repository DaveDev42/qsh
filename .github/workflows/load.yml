name: load

# T2 — the adversarial-load harness (`PLAN.md` M8 Step 4c,
# `docs/design/testing.md` L9/L10, `docs/ROADMAP.md` M8 DoD 5,
# `crates/qsh-cli/tests/adversarial_load.rs`). Measures a **release**
# `qsh serve` subprocess under fixed adversarial N (source flood, connection
# flood, session flood, sustained rejection flood — split into row-count
# aggregation / rotation+retention volume / rotation-failure fail-closed,
# `-R` accept flood) and asserts the RSS/fd/echo bounds DoD 5 names.
#
# Kept as its own workflow, entirely separate from `ci.yml`'s `ci-ok`
# required-check aggregation (ARBITRATION-4.md J1), for the same reason
# `fuzz-smoke.yml` is: this measures absolute numbers (RSS in MB, echo p95
# in ms, fd counts) on a shared hosted runner, and `docs/design/testing.md`'s
# CI discipline is explicit that absolute-number trends belong in a
# non-blocking job, not the PR-required path — a shared runner's flake on an
# absolute threshold trains reviewers to ignore red checks. `ci-ok`'s
# `needs` list (`ci.yml:179-182`) does not include this job.
#
# Unlike `fuzz-smoke.yml`, this job has no `continue-on-error`: a bound
# violation here is a single yes/no observation (did the listener leak
# memory or fds under adversarial load), not the "first day, nobody has
# triaged normal flakiness yet" situation that justified `fuzz-smoke.yml`'s
# soft landing. Red here is meant to be looked at.
#
# No `pull_request` trigger and no nightly schedule — `push` (main) and
# `workflow_dispatch` only, so this runs after a merge and on demand, never
# gating a PR. There is no trend-storage backend for this data yet, so a
# schedule would only add noise (ARBITRATION-4.md J1).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: load-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  adversarial-load:
    name: adversarial-load
    runs-on: ubuntu-24.04
    # Budget: `BRIEF-4c.md` §2.1's per-scenario budgets summed to ~155s
    # (worst case, ceiling per scenario) for the original 5-scenario shape.
    # Stage 4c-F2 split scenario 12 into three (12a/12b/12c), for 11 test
    # functions total in the file (10 `#[tokio::test]` + one pure-function
    # `#[test]`), 12c skipping itself when running as root. A measured
    # strict run (`PROGRESS-4.md` Stage 4c-S5, WSL, `~/fuzz`'s 8 workers
    # saturating the host) finished the pre-split 9-test shape in 20.8s
    # wall-clock; the split adds one more short flood (12b, a few seconds
    # to force rotation at a few-hundred-byte `max_bytes`) and one bounded
    # retry loop (12c, up to 200 round trips) — this workflow's
    # `--profile load` runs `[profile.load]`'s `test-threads = 1`
    # (`.config/nextest.toml`), so a GHA runner with no WSL-style
    # contention should land well inside the original ~155s ceiling plus
    # this split's addition.
    #
    # M8 Step 5 added a second nextest run in this job — the short-mode
    # soak scenario (`crates/qsh-cli/tests/soak.rs`, default 120s steady
    # state + 8 sessions + a 90s drain wait for `CLOSED_RETENTION` +
    # `REAPER_TICK`), a few more minutes on top of adversarial_load's own
    # budget above. 40 minutes (raised from 30, `BRIEF-5.md` §5) leaves
    # headroom for a release build plus both genuinely slow runs without
    # letting a runaway eat the runner's 6-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Runner environment record (BRIEF-4c.md §2.2): source-8 loopback
      # multiplexing and the 512-TCP scenario both depend on values that
      # are otherwise unconfirmed for GHA's ubuntu-24.04 runner. Printed
      # unconditionally, not only on failure, so the campaign doc's
      # environment section can be filled in from a normal green run too.
      - name: Record runner limits
        run: |
          echo "ulimit -n: $(ulimit -n)"
          echo "nproc: $(nproc)"
          echo "net.core.rmem_max: $(cat /proc/sys/net/core/rmem_max)"
      - run: cargo build --release -p qsh-cli
      - run: cargo nextest run --profile load -p qsh-cli --test adversarial_load --no-fail-fast
        env:
          QSH_LOAD_STRICT: 1
          QSH_LOAD_BIN: ${{ github.workspace }}/target/release/qsh
      # M8 Step 5 — the short-mode soak scenario (`crates/qsh-cli/tests/
      # soak.rs`, `docs/design/testing.md` L4 "구현(M8 Step 5)"). Same
      # env, same release binary, same `[profile.load]` — this is the
      # regression-watchdog speed of the one soak.rs scenario; the 24h/
      # 100-session speed runs under `[profile.soak]` on a dedicated host,
      # never here (`docs/campaigns/m8-soak.md`). `QSH_SOAK_CSV` gives
      # `summarize.py` (below) something to judge — without it the test
      # still asserts its own always-checked axes, but the CSV-only axes
      # (per-session buffer, RSS trend, quarters notes) never get any CI
      # coverage at all (REVIEW-5-C C7 / REVIEW-5-B B9 / ARBITRATION-5 F2).
      - run: cargo nextest run --profile load -p qsh-cli --test soak --no-fail-fast
        env:
          QSH_LOAD_STRICT: 1
          QSH_LOAD_BIN: ${{ github.workspace }}/target/release/qsh
          QSH_SOAK_CSV: ${{ runner.temp }}/soak.csv
      # `summarize.py`'s own self-test, so a bug in the judge itself (not
      # just in the soak scenario it judges) fails this same required-ish
      # signal instead of only ever being caught by a human running
      # `--self-test` locally.
      - run: python3 scripts/soak/summarize.py --self-test
      # Judge the short-mode CSV the step above just wrote. `--sessions 8`
      # is `soak.rs`'s own short-mode default (`QSH_SOAK_SESSIONS` unset
      # above) — the per-session-buffer and RSS-trend axes this adds on
      # top of the test binary's own asserts are record-only at this
      # sample count (`evaluate`'s `TREND_MIN_SPAN_SECS` note), same as a
      # local short run.
      - run: python3 scripts/soak/summarize.py "${{ runner.temp }}/soak.csv" --sessions 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-csv
          path: ${{ runner.temp }}/soak.csv
          if-no-files-found: warn
