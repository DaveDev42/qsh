[package]
name = "qsh-netbench"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Traffic generator for the M22 reproducible network bench (scripts/netbench/README.md)"

# Standalone crate, deliberately OUTSIDE the workspace root's `[workspace]`
# (the way fuzz/ is). The bench needs quinn, rustls and tokio directly, and
# none of that may reach a shipped crate, the workspace Cargo.lock or the
# `cargo xtask arch` matrix. The empty table below stops cargo from folding
# this package into the parent workspace. Cargo.lock starts as a copy of the
# workspace lock so the pinned versions match what qsh ships.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
toml = "1"

[profile.release]
debug = 1

[[bin]]
name = "netbench"
path = "src/main.rs"
